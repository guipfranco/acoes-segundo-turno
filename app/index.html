<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ações do 2º turno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;800&display=swap">
<link rel="stylesheet" href="leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pmtiles@4.5.0/dist/pmtiles.js"></script>
<script src="https://cdn.jsdelivr.net/npm/protomaps-leaflet@5.1.0/dist/protomaps-leaflet.js"></script>
<style>
:root{--papel:#fff;--tinta:#17171a;--vermelho:#d6232e;--vinho:#8c1420;--nevoa:#eef0f3;--cinza:#6e6e76;--selo:#1f7a3e;--sombra:0 -6px 24px rgba(23,23,26,.14);--nav:60px}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font-family:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--tinta);background:var(--papel);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1{font-size:26px;line-height:1.1;letter-spacing:-.02em;font-weight:800;margin:0 0 8px}
h2{font-size:17px;font-weight:800;letter-spacing:-.01em;margin:22px 0 8px}
p{margin:0 0 10px}a{color:inherit}
.sec{color:var(--cinza);font-size:13px}.erro{color:var(--vermelho);font-size:13px;margin-top:4px}
.selo{color:var(--selo);font-size:13px;font-weight:600}.prior{color:var(--vinho);font-size:13px;font-weight:600}
button{font:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--vermelho);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--vinho)}.btn[disabled]{background:var(--nevoa);color:var(--cinza);cursor:default}
.btn.sec{background:var(--papel);color:var(--tinta);border:1.5px solid var(--tinta)}.btn.sec:hover{background:var(--nevoa)}
.btn.mini{padding:8px 12px;font-size:14px}
.btn:focus-visible,input:focus-visible,.chip:focus-visible,.pill:focus-visible{outline:3px solid var(--vinho);outline-offset:2px}
label{display:block;margin:14px 0 4px;font-weight:600;font-size:14px}
input,textarea,select{width:100%;padding:11px 12px;border:1.5px solid #d4d6db;border-radius:10px;font:inherit;font-size:16px;background:#fff;color:var(--tinta)}
input:focus,textarea:focus,select:focus{border-color:var(--tinta);outline:none}
/* paginas comuns (Ação, Criar, Minhas, Fila) */
.pagina{max-width:560px;margin:0 auto;padding:18px 16px calc(var(--nav) + 24px)}
.linha{border-top:1px solid var(--nevoa);padding:12px 0}
.voltar{display:inline-block;color:var(--cinza);text-decoration:none;font-size:14px;margin-bottom:10px}
.aviso{background:#e8f4ec;border-left:4px solid var(--selo);padding:10px 12px;border-radius:8px;margin:0 0 14px;font-size:15px}
/* barra de navegacao */
nav{position:fixed;left:0;right:0;bottom:0;height:var(--nav);background:var(--papel);border-top:1px solid var(--nevoa);z-index:1000}
nav .barra{max-width:560px;margin:0 auto;height:100%;display:flex;align-items:stretch}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--cinza);font-size:11px;font-weight:600}
nav a span:first-child{font-size:20px;line-height:1}
nav a.ativo{color:var(--tinta)}
nav a.doar{background:var(--vermelho);color:#fff;flex:0 0 84px;font-size:14px}
/* inicial: busca grande, filtros e vitrine de cidades */
.inicio-pg{max-width:1100px;margin:0 auto;padding:22px 16px calc(var(--nav) + 24px)}
.hero{max-width:640px;margin:8px auto 14px;text-align:center}
.hero h1{font-size:30px}.hero p{color:var(--cinza);font-size:16px}
.caixa{position:relative;text-align:left;margin-top:16px}
.caixa .busca{padding:8px 8px 8px 18px;box-shadow:0 4px 18px rgba(23,23,26,.16)}
.caixa .busca input{font-size:17px;padding:10px 0}
.caixa #sugestoes{top:62px;z-index:900}
.link{background:none;border:0;color:var(--vinho);font-weight:600;cursor:pointer;padding:6px 0;text-decoration:underline;font-size:14px}
.filtros{display:flex;flex-direction:column;gap:6px;margin:14px 0 4px}
.filtro{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;padding:2px 0}.filtro::-webkit-scrollbar{display:none}
.filtro .rot{flex:0 0 64px;font-size:13px;font-weight:600;color:var(--cinza)}
.filtro .pill{flex:0 0 auto;border:1.5px solid var(--nevoa);background:#fff;font-size:13px;padding:7px 12px}
.filtro .pill.ativo{border-color:var(--tinta);color:var(--tinta);box-shadow:none}
.datas{display:flex;gap:8px;align-items:center;margin:2px 0 4px 70px;flex-wrap:wrap}
.datas input{flex:1 1 120px;min-width:0;width:auto;padding:8px 10px;font-size:14px}.datas span{font-size:13px;color:var(--cinza)}
.bloco{margin:26px 0 0}
.bloco .cab{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.bloco h2{margin:0;font-size:20px}.bloco .cab a{font-size:14px;font-weight:600;color:var(--vinho);white-space:nowrap}
.bloco .sub{color:var(--cinza);font-size:14px;margin:-6px 0 10px}
.trilho{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:14px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x mandatory;scrollbar-width:none;-ms-overflow-style:none}.trilho::-webkit-scrollbar{display:none}
.evento{scroll-snap-align:start;text-decoration:none;color:inherit;display:block}
.foto{aspect-ratio:16/10;border-radius:16px;position:relative;display:grid;place-items:center;font-size:56px;overflow:hidden;background:var(--nevoa)}
.foto::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 18% 12%,rgba(255,255,255,.6),transparent 55%)}
.foto .img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;display:block}
.foto .img~.data,.foto .img~.online{z-index:2}.foto .img~.data{box-shadow:0 1px 6px rgba(23,23,26,.35)}
.foto.capa{aspect-ratio:16/9;margin:0 0 14px;font-size:64px}.credito{color:var(--cinza);font-size:12px;margin:-8px 0 14px}.credito a{color:inherit}
.cubo.com-foto{background-size:cover;background-position:center}
.foto .data,.foto .online{position:absolute;top:10px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;z-index:1}
.foto .data{left:10px;background:#fff;box-shadow:0 1px 5px rgba(23,23,26,.2)}.foto .online{right:10px;background:var(--tinta);color:#fff}
.evento .tit{font-weight:600;font-size:16px;line-height:1.25;margin:10px 0 2px}
.evento .meta{font-size:14px;color:var(--cinza)}.evento .meta b{color:var(--tinta);font-weight:600}
.f-panfletagem{background:linear-gradient(135deg,#fde7e9,#f3a9b0)}.f-adesivaco{background:linear-gradient(135deg,#fff1d6,#f7c978)}.f-roda{background:linear-gradient(135deg,#e6f0ff,#a9c4f5)}
.f-ligatona{background:linear-gradient(135deg,#e8f4ec,#9fd3b0)}.f-porta{background:linear-gradient(135deg,#f1e8ff,#c5aef2)}.f-bandeiraco{background:linear-gradient(135deg,#fde7e9,#e07b84)}.f-outro{background:linear-gradient(135deg,#eef0f3,#c8ccd4)}
.vitrine-vazia{color:var(--cinza);font-size:14px;padding:10px 0}
/* mapa: mapa + busca + gaveta */
#tela-mapa{position:fixed;inset:0 0 var(--nav) 0;overflow:hidden}
#mapa{position:absolute;inset:0;background:#e9ebee}#mapa .leaflet-tile-pane{filter:saturate(.75) contrast(.95)}
#topo{position:absolute;top:12px;left:12px;right:12px;z-index:700}
.busca{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;box-shadow:0 2px 12px rgba(23,23,26,.18);padding:6px 6px 6px 16px}
.busca input{border:0;padding:8px 0;font-size:16px;flex:1;min-width:0;background:transparent}.busca input:focus{outline:none}
.busca .ico{width:38px;height:38px;border:0;border-radius:50%;background:var(--nevoa);cursor:pointer;font-size:18px;display:grid;place-items:center}
.busca .ico:hover{background:#dfe2e7}
#sugestoes{position:absolute;left:0;right:0;top:54px;background:#fff;border-radius:16px;box-shadow:0 8px 28px rgba(23,23,26,.2);overflow:hidden;display:none}
#sugestoes div,#sug-criar div{padding:12px 16px;cursor:pointer;border-top:1px solid var(--nevoa)}#sugestoes div:first-child,#sug-criar div:first-child{border:0}
#sugestoes div:hover,#sugestoes div.foco,#sug-criar div:hover{background:var(--nevoa)}#sugestoes small,#sug-criar small{color:var(--cinza);display:block}
.tipos{display:flex;gap:6px;overflow-x:auto;padding:10px 2px 4px;scrollbar-width:none;-ms-overflow-style:none}.tipos::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:1.5px solid transparent;border-radius:14px;padding:8px 10px 6px;min-width:72px;font-size:11px;font-weight:600;color:var(--cinza);cursor:pointer;box-shadow:0 1px 6px rgba(23,23,26,.12)}
.chip b{font-size:22px;line-height:1;font-weight:400}.chip.ativo{border-color:var(--tinta);color:var(--tinta)}
#gaveta{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;box-shadow:var(--sombra);transition:transform .28s ease;z-index:800;display:flex;flex-direction:column;height:calc(100% - 150px);transform:translateY(calc(100% - 132px))}
#gaveta.meio{transform:translateY(42%)}#gaveta.cheia{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){#gaveta{transition:none}}
.alca{width:44px;height:5px;border-radius:3px;background:#cfd2d8;margin:10px auto 6px;cursor:grab}
.cabeca{padding:0 16px 8px;display:flex;flex-direction:column;gap:6px}.quando{align-self:flex-start}
.cabeca .topo-gaveta{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cabeca strong{font-size:17px;letter-spacing:-.01em}.cabeca .filtros{margin:0}.cabeca .filtro .rot{display:none}.cabeca .datas{margin-left:0}
.quando{display:flex;background:var(--nevoa);border-radius:999px;padding:3px}
.pill{border:0;background:transparent;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:600;color:var(--cinza);cursor:pointer;white-space:nowrap}
.pill.ativo{background:#fff;color:var(--tinta);box-shadow:0 1px 4px rgba(23,23,26,.15)}
#lista{overflow-y:auto;flex:1;padding:0 16px 24px}
.card{display:grid;grid-template-columns:60px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--nevoa);text-decoration:none;color:inherit;align-items:start}
.card:first-child{border-top:0}.card.foco{background:#fbf3f4;margin:0 -16px;padding:14px 16px}
.cubo{width:60px;height:60px;border-radius:14px;display:grid;place-items:center;font-size:28px}
.card .tit{font-weight:600;font-size:16px;line-height:1.25;margin-bottom:2px}
.card .meta{font-size:14px;color:var(--cinza)}.card .meta b{color:var(--tinta);font-weight:600}
.vazio{padding:28px 8px;text-align:center}.vazio p{font-size:17px;font-weight:600;margin-bottom:12px}
.etiqueta{background:#fff;border-radius:999px;padding:4px 9px;font:600 12px/1 'Public Sans',sans-serif;color:var(--tinta);box-shadow:0 1px 5px rgba(23,23,26,.3);white-space:nowrap;display:inline-block;transform:translate(-50%,-50%)}
.etiqueta.foco{background:var(--vinho);color:#fff}
.t-panfletagem{background:#fde7e9}.t-adesivaco{background:#fff1d6}.t-roda{background:#e6f0ff}.t-ligatona{background:#e8f4ec}.t-porta{background:#f1e8ff}.t-bandeiraco{background:#fde7e9}.t-outro{background:var(--nevoa)}
.leaflet-container{font-family:inherit}#tela-mapa .leaflet-top,#tela-mapa .leaflet-bottom{z-index:650}.leaflet-bottom.leaflet-right{margin-bottom:126px}
.leaflet-control-attribution{font-size:10px}
/* desktop: coluna a esquerda, mapa a direita */
@media (min-width:900px){
  #topo{left:16px;right:auto;width:440px}
  #gaveta{left:16px;right:auto;width:440px;top:132px;height:auto;border-radius:22px;transform:none!important;box-shadow:0 8px 28px rgba(23,23,26,.18);bottom:16px}
  .alca{display:none}
  .leaflet-bottom.leaflet-right{margin-bottom:0}
  /* cabeçalho no topo no lugar da barra de baixo */
  :root{--cab:64px}
  body{padding-top:var(--cab)}
  nav{top:0;bottom:auto;height:var(--cab);border-top:0;border-bottom:1px solid var(--nevoa)}
  nav .barra{max-width:1180px;padding:0 24px;align-items:center;justify-content:flex-start;gap:4px}
  nav .marca{display:inline-flex;margin-right:auto;font-size:19px;font-weight:800;letter-spacing:-.02em;color:var(--tinta);padding:0}
  nav .marca em{font-style:normal;color:var(--vermelho)}
  nav a{flex:0 0 auto;flex-direction:row;gap:7px;font-size:14px;padding:0 14px;height:40px;border-radius:10px}
  nav a span:first-child{font-size:17px}nav a:hover{background:var(--nevoa)}nav a.ativo{color:var(--tinta);background:var(--nevoa)}
  nav a.doar{flex:0 0 auto;padding:0 20px;margin-left:10px;font-size:15px}nav a.doar:hover{background:var(--vinho)}
  /* páginas internas mais largas e com respiro */
  .pagina{max-width:760px;padding:32px 24px 56px}.pagina.estreita{max-width:620px}
  h1{font-size:34px}
  /* página da ação em duas colunas: conteúdo à esquerda, turnos fixos à direita */
  .acao{display:grid;grid-template-columns:minmax(0,1fr) 340px;column-gap:40px;align-items:start}
  .acao-lado{grid-column:2;grid-row:1/span 2;position:sticky;top:calc(var(--cab) + 24px);border:1.5px solid var(--nevoa);border-radius:18px;padding:6px 20px 16px;box-shadow:0 8px 28px rgba(23,23,26,.08)}
  .acao-lado h2{margin-top:14px}.acao-corpo,.acao-resto{grid-column:1}
  /* inicial: filtros em uma linha, cards em grade com hover */
  .inicio-pg{padding:36px 24px 56px}.hero{margin-bottom:28px}
  .hero h1{font-size:44px}.hero p{font-size:18px}
  .filtros{flex-direction:row;flex-wrap:wrap;gap:8px 28px;align-items:center}.datas{margin-left:0}
  .trilho{grid-auto-flow:row;grid-template-columns:repeat(4,1fr);overflow:visible}
  .foto{transition:transform .2s ease,box-shadow .2s ease}.evento:hover .foto{transform:translateY(-2px);box-shadow:0 10px 24px rgba(23,23,26,.14)}
  .evento:hover .tit{text-decoration:underline}
  /* mapa: ocupa a área abaixo do cabeçalho */
  #tela-mapa{inset:var(--cab) 0 0 0}
  #topo{top:16px}
  .cabeca .filtro{flex-wrap:wrap}
}
@media (max-width:899px){nav .marca{display:none}}
</style>
</head>
<body>
<main id="app"></main>
<nav><div class="barra">
  <a class="marca" href="#/inicio">Ações do <em>2º turno</em></a>
  <a href="#/inicio" data-rota="inicio"><span>🔍</span><span>Ações</span></a>
  <a href="#/mapa" data-rota="mapa"><span>🗺️</span><span>Mapa</span></a>
  <a href="#/criar" data-rota="criar" data-so-exemplo onclick="novaCriacao()"><span>＋</span><span>Criar ação</span></a>
  <a href="#/minhas" data-rota="minhas" data-so-exemplo><span>👤</span><span>Minhas</span></a>
  <a href="#/fila" data-rota="fila" data-so-exemplo><span>✅</span><span>Fila</span></a>
  <a href="#/inscricoes" data-rota="inscricoes"><span>🙋</span><span>Inscrições</span></a>
  <a href="#" id="conta" onclick="return contaClique()"><span>👋</span><span id="conta-rotulo">Entrar</span></a>
  <a class="doar" id="doar" href="#" target="_blank">Doar</a>
</div></nav>
<script src="dados.js"></script>
<script src="lugares.js"></script>
<script src="fundo.js"></script>
<script src="config.js"></script>
<script src="api-exemplo.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="api-supabase.js"></script>
<script src="api.js"></script>
<script>
// ---------- dados e helpers ----------
const ICONES={'panfletagem':'📄','adesivaço':'🏷️','roda de conversa':'🗣️','ligatona':'📞','porta a porta':'🚪','bandeiraço':'🚩','outro':'✨'};
const CLASSE={'panfletagem':'t-panfletagem','adesivaço':'t-adesivaco','roda de conversa':'t-roda','ligatona':'t-ligatona','porta a porta':'t-porta','bandeiraço':'t-bandeiraco','outro':'t-outro'};
const TIPOS=Object.keys(ICONES);
const estado={onde:null,quando:'breve',de:'',ate:'',formato:'qualquer',tipo:null,perto:null,geoTentada:false,gaveta:'baixa',vista:{lat:-23.62,lon:-46.62,zoom:10},foco:null,filaAba:'analise',inscrevendo:null,minhasAberta:null,avisoTexto:null,recusando:null,erroRecusa:null,aviso:null,sessao:null,acaoAberta:null};
let PUB={config:{hoje:'',frase:'',vaquinha:'#'},organizacoes:[],acoes:[],turnos:[]};
const org=id=>PUB.organizacoes.find(o=>o.id===id);
const pessoa=id=>DADOS.pessoas.find(p=>p.id===id); // só telas de organizador e moderador (modo exemplo)
const eu=()=>estado.sessao?estado.sessao.id:null;
const turnosDa=id=>PUB.turnos.filter(t=>t.acao===id).sort((a,b)=>a.inicio.localeCompare(b.inicio));
function turnosFuturos(id){return turnosDa(id).filter(t=>t.inicio.slice(0,10)>=PUB.config.hoje)}
// filtro de data: lista de opções e o intervalo [de, até] (AAAA-MM-DD, inclusivo) que cada uma representa
const QUANDO=[['breve','Em breve'],['hoje','Hoje'],['amanha','Amanhã'],['semana','Esta semana'],['fds','Fim de semana'],['proxima','Próxima semana'],['datas','Escolher datas']];
const FORMATOS=[['qualquer','Presencial e online'],['presencial','Presencial'],['online','Online']];
function intervaloQuando(){const h=PUB.config.hoje,w=new Date(h+'T00:00').getDay(),fim='9999-12-31';
  switch(estado.quando){
    case 'hoje':return[h,h];
    case 'amanha':{const a=somaDias(h,1);return[a,a]}
    case 'semana':return[h,somaDias(h,(7-w)%7)];
    case 'fds':{if(w===0)return[h,h];const sab=somaDias(h,(6-w+7)%7);return[sab,somaDias(sab,1)]}
    case 'proxima':{const seg=somaDias(h,((8-w)%7)||7);return[seg,somaDias(seg,6)]}
    case 'datas':return[estado.de&&estado.de>=h?estado.de:h,estado.ate||fim];
    default:return[h,fim]}}
function turnosNoFiltro(id){const[de,ate]=intervaloQuando();return turnosFuturos(id).filter(t=>{const d=t.inicio.slice(0,10);return d>=de&&d<=ate})}
const ehOnline=a=>!!(a.lugar&&a.lugar.online);
const temPino=a=>!ehOnline(a)&&a.lugar&&typeof a.lugar.lat==='number'&&typeof a.lugar.lon==='number';
const vaoNo=t=>t.vao||0;
const estouInscrito=tid=>!!(estado.acaoAberta&&estado.acaoAberta.inscrita.includes(tid));
// helpers só do modo exemplo, para Criar, Minhas e Fila (que ainda leem DADOS até o próximo plano)
const acaoExemplo=id=>DADOS.acoes.find(a=>a.id===id);
const turnosDaExemplo=id=>DADOS.turnos.filter(t=>t.acao===id).sort((a,b)=>a.inicio.localeCompare(b.inicio));
const inscritosNo=tid=>DADOS.inscricoes.filter(i=>i.turno===tid&&!i.canceladaEm);
const vaoNaExemplo=id=>turnosDaExemplo(id).reduce((n,t)=>n+inscritosNo(t.id).length,0);
function vaoNa(id){const ts=turnosDa(id);return ts.length?ts.reduce((n,t)=>n+vaoNo(t),0):(API.modo==='exemplo'?vaoNaExemplo(id):0)}
const DIAS=['dom','seg','ter','qua','qui','sex','sáb'];
function hora(d){return d.getHours()+'h'+(d.getMinutes()?String(d.getMinutes()).padStart(2,'0'):'')}
function fmtData(iso){const d=new Date(iso);return `${DIAS[d.getDay()]} ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}, ${hora(d)}`}
function fmtCurta(iso){const d=new Date(iso);return `${DIAS[d.getDay()]} ${hora(d)}`}
function distanciaKm(a,b){const r=6371,x=(b.lat-a.lat)*Math.PI/180,y=(b.lon-a.lon)*Math.PI/180;const s=Math.sin(x/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(y/2)**2;return 2*r*Math.asin(Math.sqrt(s))}
function quantosInscritos(n){return n===1?'1 inscrito':n+' inscritos'}
function quantosVao(n){return n===1?'1 vai':n+' vão'}
function lugarCurto(l){if(l.online)return 'Online';return l.bairro===l.cidade?l.cidade:`${l.bairro}, ${l.cidade}`}
function nomeOrganizador(a){if(a.organizacao){const o=org(a.organizacao)||DADOS.organizacoes.find(x=>x.id===a.organizacao);return esc(o.nome)+(o.verificada?' <span class="selo">✓ verificada</span>':'')}return esc(a.organizadorNome!=null?a.organizadorNome:(pessoa(a.organizador)||{}).nome)}
function somaDias(iso,n){const d=new Date(iso+'T00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// ---------- busca por lugar (municipios do IBGE + distritos da capital) ----------
const semAcento=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function buscarLugares(q,n=7){q=semAcento(q.trim());if(q.length<2)return[];const r=[];
  for(const l of LUGARES_BR){const nome=semAcento(l[0]);const i=nome.indexOf(q);if(i<0)continue;
    const peso=(i===0?0:nome[i-1]===' '?1:3)+(l[4]==='d'?0:l[4]==='c'?.5:1);r.push([peso,l])}
  return r.sort((a,b)=>a[0]-b[0]||a[1][0].localeCompare(b[1][0])).slice(0,n).map(x=>x[1])}
const rotuloLugar=l=>l[4]==='d'?`<strong>${esc(l[0])}</strong><small>bairro de São Paulo</small>`:`<strong>${esc(l[0])}</strong><small>${esc(l[1])}${l[4]==='c'?', capital':''}</small>`;
// ---------- mapa base: Protomaps da RMSP nos assets do artifact, senao tiles do OpenStreetMap ----------
const FUNDO_ARQ={};let fundoDisponivel=null;
async function fundoBase(mapa){
  const tiles=()=>L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(mapa);
  if(!window.FUNDO||typeof protomapsL==='undefined'||typeof pmtiles==='undefined')return tiles();
  if(fundoDisponivel===null){try{fundoDisponivel=(await fetch('/_blob/'+FUNDO.baixo.ids[0],{method:'HEAD'})).ok}catch(e){fundoDisponivel=false}}
  if(!fundoDisponivel)return tiles();
  const abrir=nome=>FUNDO_ARQ[nome]||(FUNDO_ARQ[nome]=Promise.all(FUNDO[nome].ids.map(id=>fetch('/_blob/'+id).then(r=>r.text()))).then(partes=>{
    const s=atob(partes.join('')),bin=new Uint8Array(s.length);for(let i=0;i<s.length;i++)bin[i]=s.charCodeAt(i);
    setTimeout(()=>{if(camada._map)camada.redraw()},0);
    return new pmtiles.PMTiles({getKey:()=>nome,getBytes:async(o,n)=>({data:bin.buffer.slice(o,o+n)})})}));
  const roteador={async getZxy(z,x,y){
    let nomes=z<=12?['baixo']:z===13?['z13']:null;
    if(!nomes){const lon=(x+.5)/(1<<z)*360-180;nomes=lon<-46.6?['oeste','leste']:['leste','oeste'];if(Math.abs(lon+46.6)>.25)nomes=nomes.slice(0,1)}
    for(const n of nomes){let r;try{r=await(await abrir(n)).getZxy(z,x,y)}catch(e){delete FUNDO_ARQ[n]}if(r)return r}
    return undefined}};
  const camada=protomapsL.leafletLayer({url:roteador,flavor:'light',lang:'pt',maxDataZoom:14,attribution:'© OpenStreetMap, Protomaps'});
  camada._clampZoom=z=>L.GridLayer.prototype._clampZoom.call(camada,Math.round(z));
  camada.addTo(mapa);return camada}
// ---------- filtros comuns (inicial e mapa) ----------
let mapa=null,marcadores=[];
// cada ação publicada entra com o primeiro turno que cabe no filtro de data; ordem: próximos turnos primeiro
function acoesVisiveis(){
  let lista=PUB.acoes.filter(a=>a.status==='publicada').map(a=>({a,t:turnosNoFiltro(a.id)[0]})).filter(x=>x.t);
  if(estado.tipo)lista=lista.filter(x=>x.a.tipo===estado.tipo);
  if(estado.formato==='online')lista=lista.filter(x=>ehOnline(x.a));
  if(estado.formato==='presencial')lista=lista.filter(x=>!ehOnline(x.a));
  lista.forEach(x=>x.km=estado.onde&&!ehOnline(x.a)?distanciaKm(estado.onde,x.a.lugar):null);
  return lista.sort((p,q)=>p.t.inicio.localeCompare(q.t.inicio)||((p.km??0)-(q.km??0)))}
const acoesOnline=()=>acoesVisiveis().filter(x=>ehOnline(x.a));
function acoesNaArea(){const todas=acoesVisiveis().filter(x=>temPino(x.a));if(!mapa)return todas;const b=mapa.getBounds();return todas.filter(x=>b.contains([x.a.lugar.lat,x.a.lugar.lon]))}
function fmtKm(km){return km<10?km.toFixed(1).replace('.',','):String(Math.round(km))}
function pillFiltro(campo,k,v){return `<button class="pill ${estado[campo]===k?'ativo':''}" data-${campo}="${k}" onclick="estado.${campo}='${k}';render()">${v}</button>`}
function filtrosHtml(){const h=PUB.config.hoje;
  return `<div class="filtros">
   <div class="filtro"><span class="rot">Quando</span>${QUANDO.map(([k,v])=>pillFiltro('quando',k,v)).join('')}</div>
   ${estado.quando==='datas'?`<div class="datas"><span>de</span><input type="date" aria-label="de" value="${estado.de}" min="${h}" onchange="estado.de=this.value;if(estado.ate&&estado.ate<this.value)estado.ate='';render()"><span>até</span><input type="date" aria-label="até" value="${estado.ate}" min="${estado.de||h}" onchange="estado.ate=this.value;render()"></div>`:''}
   <div class="filtro"><span class="rot">Formato</span>${FORMATOS.map(([k,v])=>pillFiltro('formato',k,v)).join('')}</div></div>`}
function tiposHtml(){return `<div class="tipos">${TIPOS.map(t=>`<button class="chip ${estado.tipo===t?'ativo':''}" onclick="estado.tipo=estado.tipo==='${t}'?null:'${t}';render()"><b>${ICONES[t]}</b>${t}</button>`).join('')}</div>`}
// ---------- inicial: busca por cidade e vitrine de ações pelo Brasil ----------
const VITRINE=[['São Paulo','SP',-23.55,-46.63],['Recife','PE',-8.05,-34.9],['Belo Horizonte','MG',-19.92,-43.94],['Porto Alegre','RS',-30.03,-51.23],['Salvador','BA',-12.97,-38.51]];
const PADRAO={rotulo:'São Paulo',lat:-23.55,lon:-46.63,chute:true};
function acoesPerto(c,raio=60){return acoesVisiveis().filter(x=>!ehOnline(x.a)&&distanciaKm(c,x.a.lugar)<=raio)}
// foto da ação sobre um fundo com a cor do tipo e o ícone; se a imagem falhar, fica só o fundo
const imgFoto=a=>a.foto&&a.foto.url?`<img class="img" src="${esc(a.foto.url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:'';
function fotoEvento(x){const a=x.a;return `<div class="foto f-${CLASSE[a.tipo].slice(2)}" role="img" aria-label="${esc(a.tipo)}">${ICONES[a.tipo]}${imgFoto(a)}<span class="data">${fmtCurta(x.t.inicio)}</span>${ehOnline(a)?'<span class="online">Online</span>':''}</div>`}
function creditoFoto(a){return a.foto&&a.foto.credito?`<p class="credito">Foto: ${a.foto.pagina?`<a href="${esc(a.foto.pagina)}" target="_blank" rel="noopener">${esc(a.foto.credito)}</a>`:esc(a.foto.credito)}</p>`:''}
const cuboAcao=(a,extra='')=>a.foto&&a.foto.url?`<div class="cubo ${CLASSE[a.tipo]} com-foto" style="background-image:url('${esc(a.foto.url)}');${extra}"></div>`:`<div class="cubo ${CLASSE[a.tipo]}" style="${extra}">${ICONES[a.tipo]}</div>`;
function cardEvento(x){const a=x.a;return `<a class="evento" href="#/acao/${a.id}">${fotoEvento(x)}
  <div class="tit">${esc(a.titulo)}</div>
  <div class="meta"><b>${fmtData(x.t.inicio)}</b></div>
  <div class="meta">${esc(lugarCurto(a.lugar))}</div>
  <div class="meta">${nomeOrganizador(a)}, ${quantosVao(vaoNa(a.id))}</div></a>`}
function blocoVitrine(titulo,lista,link,sub){return `<section class="bloco"><div class="cab"><h2>${titulo}</h2>${link||''}</div>${sub?`<p class="sub">${sub}</p>`:''}
  ${lista.length?`<div class="trilho">${lista.map(cardEvento).join('')}</div>`:'<p class="vitrine-vazia">Nenhuma ação com esses filtros por aqui.</p>'}</section>`}
function telaInicio(){const perto=estado.perto||PADRAO;
  const linkMapa=c=>`<a href="#/mapa" onclick="irParaCidade(${c.lat},${c.lon},'${esc(c.rotulo)}');return false">Ver no mapa</a>`;
  return `<div class="inicio-pg"><header class="hero"><h1>${esc(PUB.config.frase)}</h1><p>Panfletagem, adesivaço, roda de conversa, ligatona. Encontre uma ação perto de você e diga que vai.</p>
   <div class="caixa"><div class="busca"><span>🔍</span><input id="busca-lugar" placeholder="Em que cidade você está?" autocomplete="off" oninput="sugerir(this.value)" onkeydown="teclaBusca(event)" onfocus="sugerir(this.value)">
    <button class="ico" title="Usar minha localização" onclick="usarLocalizacao()">📍</button></div><div id="sugestoes"></div></div>
   <button class="link" onclick="estado.formato='online';render();document.getElementById('bloco-online').scrollIntoView({behavior:'smooth'})">Prefiro ajudar online, de onde estiver</button></header>
  ${filtrosHtml()}${tiposHtml()}
  ${estado.formato==='online'?'':blocoVitrine(`Perto de você: ${esc(perto.rotulo)}`,acoesPerto(perto),linkMapa(perto),perto.chute?'Chutamos a cidade. Não é aí? Digite a sua na busca.':'')}
  ${estado.formato==='online'?'':VITRINE.filter(c=>c[0]!==perto.rotulo).map(c=>blocoVitrine(esc(c[0]),acoesPerto({lat:c[2],lon:c[3]}),linkMapa({rotulo:c[0],lat:c[2],lon:c[3]}))).join('')}
  ${estado.formato==='presencial'?'':`<div id="bloco-online">${blocoVitrine('Online, de qualquer lugar',acoesOnline(),'','Ligatona e mutirão de mensagens: você participa de casa, pelo celular.')}</div>`}
  <section class="bloco"><div class="vazio"><p>Não achou ação na sua cidade?</p><a class="btn" href="#/criar" onclick="novaCriacao()">Criar a primeira ação</a></div></section>
  <p class="credito" style="text-align:center;margin-top:24px">Fotos de exemplo do Wikimedia Commons, com licenças livres. O crédito de cada uma está na página da ação.</p></div>`}
function irParaCidade(lat,lon,rotulo){estado.onde={rotulo,lat,lon};estado.vista={lat,lon,zoom:11};location.hash='#/mapa'}
// chute da cidade: pede a localização uma vez e escolhe o município mais próximo (capital se estiver a até 40 km)
function chutarCidade(){if(estado.geoTentada||!navigator.geolocation)return;estado.geoTentada=true;
  navigator.geolocation.getCurrentPosition(p=>{const eu={lat:p.coords.latitude,lon:p.coords.longitude};let melhor=null,cap=null;
    for(const l of LUGARES_BR){if(l[4]==='d')continue;const km=distanciaKm(eu,{lat:l[2],lon:l[3]});if(!melhor||km<melhor.km)melhor={l,km};if(l[4]==='c'&&(!cap||km<cap.km))cap={l,km}}
    const e=cap&&cap.km<=40?cap:melhor;if(!e)return;estado.perto={rotulo:e.l[0],lat:e.l[2],lon:e.l[3],chute:false};
    if((location.hash||'#/inicio').startsWith('#/inicio'))render()},()=>{},{timeout:8000,maximumAge:600000})}
// ---------- mapa ----------
function cardAcao(x){const a=x.a;return `<a class="card ${estado.foco===a.id?'foco':''}" id="card-${a.id}" href="#/acao/${a.id}" onmouseenter="focar(${a.id})" onmouseleave="focar(null)">
  ${cuboAcao(a)}
  <div><div class="tit">${esc(a.titulo)}</div>
  <div class="meta">${nomeOrganizador(a)}</div>
  <div class="meta"><b>${fmtData(x.t.inicio)}</b></div>
  <div class="meta">${esc(lugarCurto(a.lugar))}${x.km!=null?`, a ${fmtKm(x.km)} km`:''}</div>
  <div class="meta">${quantosVao(vaoNa(a.id))}${a.prioritaria?' <span class="prior">Área prioritária</span>':''}</div></div></a>`}
function telaMapa(){
  return `<div id="tela-mapa"><div id="mapa" aria-label="Mapa das ações"></div>
  <div id="topo"><div class="busca"><span>🔍</span><input id="busca-lugar" placeholder="Cidade ou bairro" autocomplete="off" value="${esc(estado.onde?estado.onde.rotulo:'')}" oninput="sugerir(this.value)" onkeydown="teclaBusca(event)" onfocus="sugerir(this.value)">
    <button class="ico" title="Usar minha localização" onclick="usarLocalizacao()">📍</button></div><div id="sugestoes"></div>
   ${tiposHtml()}</div>
  <div id="gaveta" class="${estado.gaveta==='meio'?'meio':estado.gaveta==='cheia'?'cheia':''}"><div class="alca" onclick="alternarGaveta()" ontouchstart="arrastar(event)"></div>
   <div class="cabeca"><div class="topo-gaveta"><strong id="contagem"></strong></div>${filtrosHtml()}</div>
   <div id="lista"></div></div></div>`}
function montarMapa(){
  const el=document.getElementById('mapa');if(!el)return;
  mapa=L.map(el,{zoomControl:false}).setView([estado.vista.lat,estado.vista.lon],estado.vista.zoom);
  L.control.zoom({position:'bottomright'}).addTo(mapa);
  fundoBase(mapa);
  mapa.on('moveend',()=>{const c=mapa.getCenter();estado.vista={lat:c.lat,lon:c.lng,zoom:mapa.getZoom()};atualizarLista()});
  atualizarLista();
}
function etiquetaPino(x){return L.divIcon({html:`<span class="etiqueta ${estado.foco===x.a.id?'foco':''}">${ICONES[x.a.tipo]} ${fmtCurta(x.t.inicio)}</span>`,className:'',iconSize:[0,0]})}
function abrirGaveta(nivel){estado.gaveta=nivel;const g=document.getElementById('gaveta');if(g)g.className=nivel==='baixa'?'':nivel}
function atualizarLista(){
  if(!mapa)return;
  const todas=acoesVisiveis().filter(x=>temPino(x.a)),aqui=acoesNaArea();
  marcadores.forEach(m=>m.remove());marcadores=[];
  todas.forEach(x=>{const m=L.marker([x.a.lugar.lat,x.a.lugar.lon],{icon:etiquetaPino(x),riseOnHover:true});m._acao=x.a.id;m.addTo(mapa);
    m.on('click',()=>{focar(x.a.id);if(estado.gaveta==='baixa')abrirGaveta('meio');const c=document.getElementById('card-'+x.a.id);if(c)c.scrollIntoView({block:'nearest'})});marcadores.push(m)});
  const online=estado.formato==='presencial'?[]:acoesOnline();
  document.getElementById('contagem').textContent=aqui.length?`${aqui.length===1?'1 ação':aqui.length+' ações'} nesta área`:'Nenhuma ação nesta área';
  document.getElementById('lista').innerHTML=(aqui.length?aqui.map(cardAcao).join(''):
    `<div class="vazio"><p>Ainda não tem ação por aqui.</p><p class="sec" style="font-weight:400">Afaste o mapa para ver outras, ou crie a primeira ação do seu bairro.</p><a class="btn" href="#/criar" onclick="novaCriacao()">Criar ação</a></div>`)
    +(online.length?`<h2 style="margin-top:18px">Online, de qualquer lugar</h2>${online.map(cardAcao).join('')}`:'');
}
function focar(id){estado.foco=id;document.querySelectorAll('.card').forEach(c=>c.classList.toggle('foco',c.id==='card-'+id));
  marcadores.forEach(m=>{const el=m.getElement();const e=el&&el.querySelector('.etiqueta');if(e)e.classList.toggle('foco',m._acao===id)})}
function alternarGaveta(){abrirGaveta(estado.gaveta==='baixa'?'meio':estado.gaveta==='meio'?'cheia':'baixa')}
function arrastar(ev){const y0=ev.touches[0].clientY;const fim=e=>{document.removeEventListener('touchend',fim);const dy=e.changedTouches[0].clientY-y0;if(Math.abs(dy)<30)return;
  const ordem=['baixa','meio','cheia'];let i=ordem.indexOf(estado.gaveta)+(dy<0?1:-1);abrirGaveta(ordem[Math.max(0,Math.min(2,i))])};document.addEventListener('touchend',fim)}
let sugFoco=-1,sugAtual=[];
function sugerir(q){const box=document.getElementById('sugestoes');sugAtual=buscarLugares(q);sugFoco=-1;
  box.innerHTML=sugAtual.map((l,i)=>`<div onclick="escolherSugestao(${i})">${rotuloLugar(l)}</div>`).join('');box.style.display=sugAtual.length?'block':'none'}
function teclaBusca(e){if(!sugAtual.length)return;if(e.key==='ArrowDown'){sugFoco=Math.min(sugAtual.length-1,sugFoco+1)}else if(e.key==='ArrowUp'){sugFoco=Math.max(0,sugFoco-1)}else if(e.key==='Enter'){escolherSugestao(sugFoco<0?0:sugFoco);return}else if(e.key==='Escape'){document.getElementById('sugestoes').style.display='none';return}else return;
  document.querySelectorAll('#sugestoes div').forEach((d,i)=>d.classList.toggle('foco',i===sugFoco))}
const nomeLugar=l=>l[4]==='d'?`${l[0]}, São Paulo`:`${l[0]}, ${l[1]}`;
function escolherSugestao(i){const l=sugAtual[i];if(!l)return;document.getElementById('busca-lugar').value=nomeLugar(l);document.getElementById('sugestoes').style.display='none';irParaLugar(l)}
function irParaLugar(l){estado.onde={rotulo:nomeLugar(l),lat:l[2],lon:l[3]};const zoom=l[4]==='d'?13:l[4]==='c'?11:12;
  if(mapa)mapa.setView([l[2],l[3]],zoom);else{estado.vista={lat:l[2],lon:l[3],zoom};location.hash='#/mapa'}
  if(estado.gaveta==='baixa')abrirGaveta('meio')}
function usarLocalizacao(){if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>{irParaLugar(['Minha localização','',p.coords.latitude,p.coords.longitude,'g'])},()=>{})}
// ---------- acao ----------
async function entrar(){await API.entrar();await sincronizar()}
async function sair(){await API.sair();localStorage.removeItem('vouPendente');estado.inscrevendo=null;await sincronizar()}
function contaClique(){(estado.sessao?sair():entrar()).catch(e=>console.error(e));return false}
function telaInscricoes(){
  if(!estado.sessao)return `<div class="pagina estreita"><h1>Minhas inscrições</h1><p>Entre para ver em que ações você disse que vai.</p><button class="btn" onclick="entrar()">Entrar com Google</button></div>`;
  const lista=estado.minhasInscricoes||[];
  return `<div class="pagina"><h1>Minhas inscrições</h1><p class="sec" style="font-size:15px">${esc(estado.sessao.nome)}${estado.sessao.telefone?`, ${esc(estado.sessao.telefone)}`:''}</p>
  ${lista.length?`<div class="trilho">${lista.map(m=>cardEvento({a:m.acao,t:m.turno})).join('')}</div>`:'<div class="vazio"><p>Você ainda não se inscreveu em nenhuma ação.</p><a class="btn" href="#/inicio">Ver ações</a></div>'}</div>`}
async function desistir(tid){await API.desistir(tid);await sincronizar()}
async function iniciarVou(tid){
  if(!estado.sessao){localStorage.setItem('vouPendente',String(tid));await API.entrar();await continuarVouPendente();return}
  estado.inscrevendo={turno:tid,telefone:estado.sessao.telefone||'',erro:null};render()}
async function continuarVouPendente(){const tid=Number(localStorage.getItem('vouPendente'));if(!tid)return;
  estado.sessao=await API.sessao();if(!estado.sessao)return;localStorage.removeItem('vouPendente');
  estado.inscrevendo={turno:tid,telefone:estado.sessao.telefone||'',erro:null};await render()}
const MENSAGEM={precisa_entrar:'Entre para se inscrever.',sem_telefone:'Informe seu WhatsApp.',telefone_invalido:'Telefone no formato (11) 9xxxx-xxxx.',bloqueada:'Sua conta está bloqueada.',lotado:'Esse horário lotou.',turno_passado:'Esse horário já passou.',nao_publicada:'Esta ação não está aberta a inscrições.'};
async function confirmarVou(tid){const ins=estado.inscrevendo;const tel=(document.getElementById('vtel')||{}).value||'';
  try{if(tel!==(estado.sessao.telefone||''))estado.sessao=await API.salvarTelefone(tel);await API.inscrever(tid)}
  catch(e){ins.erro=MENSAGEM[e.codigo]||'Não deu. Tente de novo.';ins.telefone=tel;render();return}
  estado.inscrevendo=null;await sincronizar()}
async function inscrever(tid){return confirmarVou(tid)}
function compartilhar(){const u=location.href;if(navigator.share)navigator.share({url:u});else{navigator.clipboard&&navigator.clipboard.writeText(u);alert('Link copiado')}}
function botaoTurno(t){const n=vaoNo(t);
  if(t.inicio.slice(0,10)<PUB.config.hoje)return `<button class="btn" disabled>horário encerrado</button>${estouInscrito(t.id)?' <span class="selo">você estava inscrito</span>':''}`;
  if(estouInscrito(t.id))return `<span class="selo">Inscrito ✓</span> <button class="btn sec mini" onclick="desistir(${t.id})">desistir</button>`;
  if(t.lotacao&&n>=t.lotacao)return `<button class="btn" disabled>lotado</button>`;
  return `<button class="btn" onclick="iniciarVou(${t.id})">Inscreva-se</button>`}
function telaAcao(){const ab=estado.acaoAberta;if(!ab)return '<div class="pagina"><p>Ação não encontrada.</p></div>';const a=ab.acao,fechada=a.status!=='publicada';

  ${lista.map(a=>{const t=turnosDaExemplo(a.id)[0]||{inicio:a.criadaEm+'T00:00'};const p=pessoa(a.organizador);const o=a.organizacao?org(a.organizacao):null;return `<div class="linha">${cardAcao({a,t,km:null})}
   <div class="sec">Organizador: ${esc(p.nome)}, ${p.telefone}. ${historicoOrganizador(p.id)}.</div>
   <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">${aba==='analise'?`<button class="btn mini" onclick="aprovar(${a.id})">Aprovar</button> <button class="btn sec mini" onclick="estado.recusando=${a.id};render()">Recusar</button>${o&&!o.verificada?` <button class="btn sec mini" onclick="darSelo(${o.id})">Dar selo à organização</button>`:''}`:
     `<button class="btn sec mini" onclick="despublicar(${a.id})">Despublicar</button> <button class="btn sec mini" onclick="bloquear(${p.id})">Bloquear organizador</button>`}</div>
   ${estado.recusando===a.id?`<label>Motivo da recusa</label><input id="motivo${a.id}" placeholder="ex.: pede dinheiro para o material">${estado.erroRecusa?`<div class="erro">${estado.erroRecusa}</div>`:''}<div style="margin-top:8px"><button class="btn mini" onclick="recusar(${a.id})">Confirmar recusa</button></div>`:''}</div>`}).join('')}</div>`}
// ---------- roteamento ----------
async function recarregar(){PUB=await API.publico();estado.sessao=await API.sessao()}
let renderN=0;
async function render(){
  const n=++renderN;
  const h=location.hash||'#/inicio';const [,rota,arg]=h.split('/');
  if(rota!=='acao')estado.inscrevendo=null;if(rota!=='fila'){estado.recusando=null;estado.erroRecusa=null}
  try{
    if(rota==='acao'){const r=await API.acao(Number(arg));if(n!==renderN)return;estado.acaoAberta=r}
    if(rota==='inscricoes'){const r=await API.minhasInscricoes();if(n!==renderN)return;estado.minhasInscricoes=r}
  }catch(e){if(n!==renderN)return;console.error(e);if(mapa){mapa.remove();mapa=null;marcadores=[]}
    document.getElementById('app').innerHTML='<div class="pagina"><p class="erro">Não foi possível carregar. Tente de novo.</p></div>';return}
  if(mapa){mapa.remove();mapa=null;marcadores=[]}
  const app=document.getElementById('app');
  const soExemplo=['criar','minhas','fila'].includes(rota)&&API.modo!=='exemplo';
  app.innerHTML=soExemplo?'<div class="pagina"><h1>Em breve</h1><p>Criar ação, Minhas ações e a Fila chegam na próxima etapa.</p></div>':
    rota==='acao'?telaAcao():rota==='inscricoes'?telaInscricoes():rota==='criar'?telaCriar():rota==='minhas'?telaMinhas():rota==='fila'?telaFila():rota==='mapa'?telaMapa():telaInicio();
  document.querySelectorAll('nav a[data-rota]').forEach(a=>a.classList.toggle('ativo',a.dataset.rota===(rota||'inicio')));
  document.querySelectorAll('nav a[data-so-exemplo]').forEach(a=>a.style.display=API.modo==='exemplo'?'':'none');
  document.getElementById('conta-rotulo').textContent=estado.sessao?'Sair':'Entrar';
  document.getElementById('doar').href=PUB.config.vaquinha||'#';
  if(rota==='mapa')montarMapa();
  if((rota||'inicio')==='inicio')chutarCidade();
  const ab=estado.acaoAberta;
  if(rota==='acao'&&ab&&!ehOnline(ab.acao))montarMiniMapa(ab.acao.lugar,false);
  if(rota==='criar'&&estado.criar.passo===2&&!estado.criar.online&&estado.criar.lugar.lat!=null){const r=montarMiniMapa(estado.criar.lugar,true);if(r)r.mk.on('dragend',()=>{const p=r.mk.getLatLng();estado.criar.lugar.lat=p.lat;estado.criar.lugar.lon=p.lng})}
  if(rota!=='mapa')window.scrollTo(0,0);
}
async function sincronizar(){await recarregar();
  if(location.search.includes('code=')){history.replaceState(null,'',location.pathname+location.hash)}
  if(estado.sessao&&localStorage.getItem('vouPendente')){await continuarVouPendente();return}
  await render()}
document.addEventListener('click',e=>{if(!e.target.closest('#topo,.caixa')){const s=document.getElementById('sugestoes');if(s)s.style.display='none'}});
window.addEventListener('hashchange',render);
window.addEventListener('DOMContentLoaded',sincronizar);
</script>
