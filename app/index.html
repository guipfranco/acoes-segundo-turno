<style>
:root{--papel:#fff;--tinta:#17171a;--vermelho:#d6232e;--vinho:#8c1420;--nevoa:#eef0f3;--cinza:#6e6e76;--selo:#1f7a3e;--sombra:0 -6px 24px rgba(23,23,26,.14);--nav:calc(60px + env(safe-area-inset-bottom,0px))}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font-family:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--tinta);background:var(--papel);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1{font-size:26px;line-height:1.1;letter-spacing:-.02em;font-weight:800;margin:0 0 8px}
h2{font-size:17px;font-weight:800;letter-spacing:-.01em;margin:22px 0 8px}
p{margin:0 0 10px}a{color:inherit}
.sec{color:var(--cinza);font-size:13px}.erro{color:var(--vermelho);font-size:13px;margin-top:4px}
.selo{color:var(--selo);font-size:13px;font-weight:600}.prior{color:var(--vinho);font-size:13px;font-weight:600}
button{font:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--vermelho);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--vinho)}.btn[disabled]{background:var(--nevoa);color:var(--cinza);cursor:default}
.btn.sec{background:var(--papel);color:var(--tinta);border:1.5px solid var(--tinta)}.btn.sec:hover{background:var(--nevoa)}
.btn.mini{padding:8px 12px;font-size:14px}
.btn:focus-visible,input:focus-visible,.chip:focus-visible,.pill:focus-visible{outline:3px solid var(--vinho);outline-offset:2px}
label{display:block;margin:14px 0 4px;font-weight:600;font-size:14px}
.horarios{display:grid;grid-template-columns:1fr 1fr;gap:10px}.horarios label{margin-top:10px}
label.marcar{display:flex;gap:10px;align-items:center;font-weight:400;font-size:16px;margin-top:18px;cursor:pointer}label.marcar input{width:22px;height:22px;flex:none;margin:0}
input,textarea,select{width:100%;padding:11px 12px;border:1.5px solid #d4d6db;border-radius:10px;font:inherit;font-size:16px;background:#fff;color:var(--tinta)}
input:focus,textarea:focus,select:focus{border-color:var(--tinta);outline:none}
/* paginas comuns (Ação, Criar, Minhas, Fila) */
.pagina{max-width:560px;margin:0 auto;padding:18px 16px calc(var(--nav) + 24px)}
.linha{border-top:1px solid var(--nevoa);padding:12px 0}
.voltar{display:inline-block;color:var(--cinza);text-decoration:none;font-size:14px;margin-bottom:10px}
.aviso{background:#e8f4ec;border-left:4px solid var(--selo);padding:10px 12px;border-radius:8px;margin:0 0 14px;font-size:15px}
/* barra de navegacao */
nav{position:fixed;left:0;right:0;bottom:0;height:var(--nav);background:var(--papel);border-top:1px solid var(--nevoa);z-index:1000}
nav .barra{max-width:560px;margin:0 auto;height:100%;display:flex;align-items:stretch}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--cinza);font-size:11px;font-weight:600}
nav a>span:first-child{font-size:20px;line-height:1;display:flex}nav a>span:first-child svg{width:22px;height:22px}
nav a.ativo{color:var(--tinta)}
nav a.cta{background:var(--vermelho);color:#fff;flex:0 0 96px;font-size:14px;font-weight:700}nav a.cta>span:first-child svg{width:20px;height:20px}nav a.cta.ativo{color:#fff}
dialog.login-google{border:0;border-radius:20px;padding:28px 24px 18px;max-width:360px;width:calc(100% - 32px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25)}dialog.login-google::backdrop{background:rgba(20,20,25,.5)}dialog.login-google h2{margin:0 0 6px;font-size:22px}dialog.login-google p{margin:0 0 18px;color:#555;font-size:15px}.login-google-botao{display:flex;justify-content:center;min-height:44px}dialog.login-google .login-google-erro{color:#b3261e;margin:12px 0 0}.login-google-fechar{margin-top:14px;background:none;border:0;color:#555;font-size:15px;padding:8px;cursor:pointer;text-decoration:underline}
.btn.google{background:var(--tinta)}.btn.google:hover{background:#34343b}.btn.google .g{background:#fff;color:#d6232e;border-radius:50%;width:22px;height:22px;display:inline-grid;place-items:center;font-weight:800;font-size:14px}
.enviar-foto{margin-top:14px;cursor:pointer}.previa-card{max-width:300px;pointer-events:none}
.btn.vou{font-size:18px;padding:14px 26px;font-weight:800}.cta-topo{margin:14px 0 6px}@media (min-width:900px){.cta-topo{display:none}}
/* perfil */
.perfil-topo{display:flex;align-items:center;gap:14px;margin-bottom:6px}.perfil-topo .letra{width:56px;height:56px;border-radius:50%;background:var(--vermelho);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800;flex:none}
.perfil-topo h1{margin:0}.status{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--nevoa);color:var(--tinta)}
.status.publicada{background:#e8f4ec;color:var(--selo)}.status.analise{background:#fff1d6;color:#8a5a00}.status.recusada{background:#fde7e9;color:var(--vinho)}
.aviso-org{background:#fff7e0;border-left:4px solid #e0a100;border-radius:8px;padding:10px 12px;margin-top:10px;font-size:14px}.link-ext{color:var(--vinho);font-weight:600;font-size:13px;word-break:break-all}
.logo-org{width:44px;height:44px;border-radius:10px;object-fit:contain;background:#fff;border:1px solid var(--nevoa);flex:none}
.opcoes-quem{display:flex;flex-direction:column;gap:2px}.opcao{display:flex;align-items:center;gap:8px;margin:0;padding:8px 0;font-weight:500;font-size:15px;cursor:pointer}.opcao input{width:auto}.opcao .avatar{width:24px;height:24px}
.cartao{background:#f3f4f6;border-radius:18px;padding:16px;margin:12px 0}.cartao-topo{display:flex;align-items:center;gap:8px}
.turno-meu{background:#fff;border-radius:14px;padding:12px 14px;margin-top:12px}
.turno-meu .pessoa{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 12px;font-size:15px;padding:8px 0 0;border-top:1px solid var(--nevoa);margin-top:8px}
.turno-meu .desistiram{font-size:14px;padding-top:8px;border-top:1px solid var(--nevoa);margin-top:8px}
.btn-whats{display:inline-flex;align-items:center;gap:7px;background:var(--selo);color:#fff;border-radius:999px;padding:8px 14px;font-size:15px;font-weight:600;text-decoration:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.btn-whats:hover{background:#17602f}.btn-whats svg{width:17px;height:17px;flex:none}
.moderar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--nevoa);border-radius:12px;padding:10px 12px;margin:0 0 14px;font-size:15px}
.moderar strong{margin-right:auto}
.btn.sec.perigo{color:var(--vinho);border-color:var(--vinho)}
.ver-pagina{display:inline-block;margin-top:12px;font-weight:600;color:var(--vinho);font-size:14px}
.mais{position:relative;display:inline-block;flex:none}.mais summary{list-style:none;cursor:pointer;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:22px;line-height:1;color:var(--cinza);user-select:none}
.mais summary::-webkit-details-marker{display:none}.mais summary:hover,.mais[open] summary{background:var(--nevoa);color:var(--tinta)}
.mais .opcoes{position:absolute;right:0;top:calc(100% + 4px);background:#fff;border-radius:12px;box-shadow:0 8px 28px rgba(23,23,26,.2);padding:6px;z-index:60;min-width:170px}
.mais .opcoes button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px;font-size:14px;cursor:pointer;color:var(--tinta)}
.mais .opcoes button:hover{background:var(--nevoa)}.mais .opcoes button.perigo{color:var(--vinho)}
/* menu aberto perto da borda: vira para dentro da tela (ver ajeitarMenu) */
.mais .opcoes.esq,.agenda .opcoes.esq,.insc-acoes .agenda .opcoes.esq{left:0;right:auto}.mais .opcoes.dir,.agenda .opcoes.dir,.insc-acoes .agenda .opcoes.dir{left:auto;right:0}
.vai{display:flex;align-items:center;gap:6px}
.passadas{margin-top:12px}.passadas summary{cursor:pointer;color:var(--cinza);font-size:14px;font-weight:600;padding:6px 0}
#recado{position:fixed;left:50%;bottom:calc(var(--nav) + 16px);transform:translate(-50%,20px);background:var(--tinta);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:.2s;z-index:2000}
#recado.visivel{opacity:1;transform:translate(-50%,0)}@media (min-width:900px){#recado{bottom:24px}}
/* minhas inscrições: uma ação por linha */
.insc{display:flex;align-items:center;gap:8px 14px;padding:12px 0;border-top:1px solid var(--nevoa);flex-wrap:wrap}.lista-insc .insc:first-child{border-top:0}
.insc-link{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;flex:1 1 280px;min-width:0;text-decoration:none;color:inherit}
.insc .tit{font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.insc-link:hover .tit{text-decoration:underline}
.insc .meta{font-size:14px;color:var(--cinza);margin-top:3px}.insc .meta b{color:var(--tinta);font-weight:600}
.insc-acoes{display:flex;align-items:center;gap:8px;margin-left:68px}.insc-acoes .agenda{margin-top:0}.insc-acoes .agenda .opcoes{left:auto;right:0}
@media (min-width:900px){.insc-acoes{margin-left:0}}
/* inicial: busca grande, filtros e vitrine de cidades */
.inicio-pg{max-width:1100px;margin:0 auto;padding:22px 16px calc(var(--nav) + 24px)}
.hero{max-width:640px;margin:8px auto 14px;text-align:center}
.hero h1{font-size:30px}.hero p{color:var(--cinza);font-size:16px}
.caixa{position:relative;text-align:left;margin-top:16px}
.caixa .busca{padding:8px 8px 8px 18px;box-shadow:0 4px 18px rgba(23,23,26,.16)}
.caixa .busca input{font-size:17px;padding:10px 0}
.caixa #sugestoes{top:62px;z-index:900}
.hero-cta{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:18px;font-size:15px;color:var(--cinza)}
.link{background:none;border:0;color:var(--vinho);font-weight:600;cursor:pointer;padding:6px 0;text-decoration:underline;font-size:14px}
.filtros{display:flex;flex-direction:column;gap:6px;margin:14px 0 4px}
.filtro{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;padding:2px 0}.filtro::-webkit-scrollbar{display:none}
.filtro .rot{flex:0 0 64px;font-size:13px;font-weight:600;color:var(--cinza)}
.filtro .pill{flex:0 0 auto;border:1.5px solid var(--nevoa);background:#fff;font-size:13px;padding:7px 12px}
.filtro .pill.ativo{border-color:var(--tinta);color:var(--tinta);box-shadow:none}
.datas{display:flex;gap:8px;align-items:center;margin:2px 0 4px;flex-wrap:wrap}
.datas input{flex:1 1 120px;min-width:0;width:auto;padding:8px 10px;font-size:14px}.datas span{font-size:13px;color:var(--cinza)}
.bloco{margin:32px 0 0}
.bloco .cab{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.bloco h2{margin:0;font-size:20px}.bloco .cab a{font-size:14px;font-weight:600;color:var(--vinho);white-space:nowrap}
.bloco .sub{color:var(--cinza);font-size:14px;margin:-6px 0 10px}
.trilho{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(208px,232px);gap:18px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x mandatory;scrollbar-width:none;-ms-overflow-style:none}.trilho::-webkit-scrollbar{display:none}
.evento{scroll-snap-align:start;text-decoration:none;color:inherit;display:block;min-width:0}
/* card vertical (4:5), o formato do post do Instagram: a arte aparece inteira; o que sobra (foto 3:4, quadrada,
   horizontal) é preenchido com a própria imagem desfocada, sem cortar texto do cartaz */
.foto{aspect-ratio:4/5;border-radius:16px;position:relative;display:grid;place-items:center;font-size:56px;overflow:hidden;background:var(--nevoa)}
.foto::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 18% 12%,rgba(255,255,255,.6),transparent 55%)}
.foto .img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:1;display:block}
.foto .fundo{position:absolute;inset:-24px;width:calc(100% + 48px);height:calc(100% + 48px);object-fit:cover;filter:blur(20px) brightness(.9);z-index:1;display:block}
.foto .img~.data,.foto .img~.online{z-index:2}.foto .img~.data{box-shadow:0 1px 6px rgba(23,23,26,.35)}
.foto.capa{aspect-ratio:16/9;margin:0 0 14px;font-size:64px}
/* capa com foto: sem caixa fixa, a imagem na proporção dela (limitada à altura da tela) */
.foto.capa.natural{aspect-ratio:auto;min-height:120px;display:block;font-size:0}.foto.capa.natural .img{position:relative;height:auto;max-height:78vh}.credito{color:var(--cinza);font-size:12px;margin:-8px 0 14px}.credito a{color:inherit}
.cubo.com-foto{background-size:cover;background-position:center}
.foto .data,.foto .online{position:absolute;top:10px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;z-index:1}
.foto .data{left:10px;background:#fff;box-shadow:0 1px 5px rgba(23,23,26,.2)}.foto .online{right:10px;background:var(--tinta);color:#fff}
.foto .logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:54%;height:58%;object-fit:contain;background:#fff;border-radius:14px;padding:10px;box-sizing:border-box;z-index:1;box-shadow:0 2px 10px rgba(23,23,26,.18)}
.foto.capa .logo{width:40%;height:56%}
.quem{display:inline-flex;align-items:center;gap:6px;min-width:0}.quem>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{flex:none;width:22px;height:22px;border-radius:50%;object-fit:contain;background:#fff;border:1px solid var(--nevoa);padding:1px;box-sizing:border-box}
.avatar.letra{display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--nevoa);color:var(--tinta);border:0}
.evento .tit{font-weight:600;font-size:16px;line-height:1.3;margin:12px 0 6px}
.evento .meta{font-size:14px;line-height:1.4;color:var(--cinza);margin-top:3px}.evento .meta b{color:var(--tinta);font-weight:600}
/* ações online: lista compacta em vez do trilho de cartazes */
.lista-online{display:grid;gap:6px}.lista-online:not(.aberto) .evento-online:nth-child(n+5){display:none}
.evento-online{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center;text-decoration:none;color:inherit;padding:8px 0;border-top:1px solid var(--nevoa)}
.evento-online:first-child{border-top:0}.evento-online .tit{font-weight:600;font-size:15px;line-height:1.3}.evento-online:hover .tit{text-decoration:underline}
.evento-online .meta{font-size:13px;line-height:1.4;color:var(--cinza);margin-top:2px}.evento-online .meta b{color:var(--tinta);font-weight:600}.evento-online .vao{margin-top:2px}
.foto.mini{aspect-ratio:1;border-radius:12px;font-size:26px}.foto.mini .logo{width:70%;height:70%;padding:6px;border-radius:10px}
@media (min-width:900px){.lista-online{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 28px}.evento-online:nth-child(2){border-top:0}}
/* quem organiza (avatar + nome) numa linha flex: o texto fica centrado no avatar; quantos vão em linha própria */
.meta.quem-linha{display:flex;align-items:center;gap:6px;margin-top:8px;min-width:0}.meta.quem-linha .quem{min-width:0}
.meta.vao{color:var(--selo);font-weight:600}
.f-panfletagem{background:linear-gradient(135deg,#fde7e9,#f3a9b0)}.f-adesivaco{background:linear-gradient(135deg,#fff1d6,#f7c978)}.f-encontro{background:linear-gradient(135deg,#e6f0ff,#a9c4f5)}
.f-ligatona{background:linear-gradient(135deg,#e8f4ec,#9fd3b0)}.f-porta{background:linear-gradient(135deg,#f1e8ff,#c5aef2)}.f-bandeiraco{background:linear-gradient(135deg,#fde7e9,#e07b84)}.f-outro{background:linear-gradient(135deg,#eef0f3,#c8ccd4)}
.f-ato{background:linear-gradient(135deg,#ffe4d6,#f29b72)}.f-caminhada{background:linear-gradient(135deg,#e0f5f3,#8fd1c8)}.f-cultural{background:linear-gradient(135deg,#fbe3f4,#e5a3d3)}
/* cidade do bloco "Perto de você": vira um botão que abre a busca */
.cab-cidade{position:relative}
.cidade{background:none;border:0;padding:0;font:inherit;color:var(--vinho);cursor:pointer;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.cidade:hover{color:var(--vermelho)}.cidade span{font-size:.7em;text-decoration:none;display:inline-block;margin-left:2px}
.pop-cidade{position:absolute;left:0;top:calc(100% + 8px);width:min(420px,100%);background:#fff;border-radius:16px;box-shadow:0 8px 28px rgba(23,23,26,.2);padding:10px;z-index:900}
.pop-cidade .busca{box-shadow:none;border:1.5px solid #d4d6db}
#sug-cidade div{padding:10px 12px;cursor:pointer;border-top:1px solid var(--nevoa);border-radius:8px}#sug-cidade div:first-child{border:0}
#sug-cidade div:hover,#sug-cidade div.foco{background:var(--nevoa)}#sug-cidade small{color:var(--cinza);display:block}
/* adicionar à agenda */
.agenda{display:inline-block;position:relative;margin-top:8px}
.agenda summary{list-style:none;cursor:pointer;color:var(--vinho);font-weight:600;font-size:14px;padding:4px 0}.agenda summary::-webkit-details-marker{display:none}
.agenda summary:hover{text-decoration:underline}
.agenda .opcoes{position:absolute;left:0;top:100%;background:#fff;border-radius:12px;box-shadow:0 8px 28px rgba(23,23,26,.2);padding:6px;z-index:50;min-width:210px}
.agenda .opcoes a,.agenda .opcoes button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px;font-size:14px;cursor:pointer;text-decoration:none;color:var(--tinta)}
.agenda .opcoes a:hover,.agenda .opcoes button:hover{background:var(--nevoa)}
.trilho .agenda .opcoes{position:static;box-shadow:none;padding:0;min-width:0}
/* mapa: prévia da ação ao clicar no pino (estilo Airbnb) */
.previa .leaflet-popup-content-wrapper{position:relative;z-index:1;padding:0;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(23,23,26,.28)}
.previa .leaflet-popup-content{margin:0;width:260px!important;font-family:'Public Sans',sans-serif}
.leaflet-container .previa a.leaflet-popup-close-button{z-index:2;background:#fff;color:var(--tinta);border-radius:50%;width:28px;height:28px;top:8px;right:8px;font:600 20px/26px 'Public Sans',sans-serif;text-align:center;box-shadow:0 1px 5px rgba(23,23,26,.3)}
.previa a.corpo{display:block;text-decoration:none;color:var(--tinta)}
.previa .foto{border-radius:0;aspect-ratio:1/1;font-size:44px}
.previa .txt{padding:10px 14px 12px}.previa .tit{font-weight:700;font-size:15px;line-height:1.25;margin-bottom:3px}
.previa .meta{font-size:13px;color:var(--cinza);line-height:1.4}.previa .meta b{color:var(--tinta);font-weight:600}
.previa .ver{display:inline-block;margin-top:6px;font-size:13px;font-weight:700;color:var(--vinho)}
.vitrine-vazia{color:var(--cinza);font-size:14px;padding:10px 0}
.rodape{text-align:center;font-size:13px;margin:12px auto 8px;padding:0 16px;max-width:640px}.rodape a{color:var(--cinza)}
.ver-todas{display:none}
/* mapa: mapa + busca + gaveta */
#tela-mapa{position:fixed;inset:0 0 var(--nav) 0;overflow:hidden}
#mapa{position:absolute;inset:0;background:#e9ebee}#mapa .leaflet-tile-pane{filter:saturate(.75) contrast(.95)}
/* pinos numa camada só da GPU: sem isso, com zoom afastado (centenas de pinos), o Chrome compunha cada pino à parte e o arrasto travava */
#mapa .leaflet-marker-pane{will-change:transform}
#topo{position:absolute;top:12px;left:12px;right:12px;z-index:700}
.busca{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;box-shadow:0 2px 12px rgba(23,23,26,.18);padding:6px 6px 6px 16px}
.busca input{border:0;padding:8px 0;font-size:16px;flex:1;min-width:0;background:transparent}.busca input:focus{outline:none}
.busca .ico{width:38px;height:38px;border:0;border-radius:50%;background:var(--nevoa);cursor:pointer;font-size:18px;display:grid;place-items:center}
.busca .ico:hover{background:#dfe2e7}
#sugestoes{position:absolute;left:0;right:0;top:54px;background:#fff;border-radius:16px;box-shadow:0 8px 28px rgba(23,23,26,.2);overflow:hidden;display:none}
#sugestoes div,#sug-criar div{padding:12px 16px;cursor:pointer;border-top:1px solid var(--nevoa)}#sugestoes div:first-child,#sug-criar div:first-child{border:0}
#sugestoes div:hover,#sugestoes div.foco,#sug-criar div:hover{background:var(--nevoa)}#sugestoes small,#sug-criar small{color:var(--cinza);display:block}
.tipos{display:flex;gap:6px;overflow-x:auto;padding:10px 2px 4px;scrollbar-width:none;-ms-overflow-style:none}.tipos::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border:1.5px solid transparent;border-radius:14px;padding:10px 12px 8px;min-width:84px;font-size:11px;font-weight:600;color:var(--cinza);cursor:pointer;box-shadow:0 1px 6px rgba(23,23,26,.12)}
.chip b{font-size:22px;line-height:1;font-weight:400}.chip.ativo{border-color:var(--tinta);color:var(--tinta)}
#gaveta{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;box-shadow:var(--sombra);transition:transform .28s ease;z-index:800;display:flex;flex-direction:column;height:calc(100% - 150px);transform:translateY(calc(100% - 132px))}
#gaveta.meio{transform:translateY(42%)}#gaveta.cheia{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){#gaveta{transition:none}}
.puxa{touch-action:pan-x}.alca{display:block;width:100%;border:0;background:none;padding:10px 0 8px;cursor:grab}
.alca span{display:block;width:44px;height:5px;border-radius:3px;background:#cfd2d8;margin:0 auto}#contagem{cursor:pointer}
.cabeca{padding:0 16px 8px;display:flex;flex-direction:column;gap:6px}.quando{align-self:flex-start}
.cabeca .topo-gaveta{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cabeca strong{font-size:17px;letter-spacing:-.01em}.cabeca .filtros{margin:0}.cabeca .filtro .rot{display:none}.cabeca .datas{margin-left:0}
.quando{display:flex;background:var(--nevoa);border-radius:999px;padding:3px}
.pill{border:0;background:transparent;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:600;color:var(--cinza);cursor:pointer;white-space:nowrap}
.pill.ativo{background:#fff;color:var(--tinta);box-shadow:0 1px 4px rgba(23,23,26,.15)}
#lista{overflow-y:auto;flex:1;padding:0 16px 24px;overflow-anchor:none}
.card{display:grid;grid-template-columns:60px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--nevoa);text-decoration:none;color:inherit;align-items:start}
.card:first-child{border-top:0}.card.foco{background:#f6f7f9;margin:0 -16px;padding:14px 16px}
.card.sel{background:#fde7e9;margin:0 -16px;padding:14px 16px 14px 12px;border-left:4px solid var(--vermelho);border-top-color:transparent}
.card.sel+.card{border-top-color:transparent}.card.sel .tit{color:var(--vinho)}
.cubo{width:60px;height:60px;border-radius:14px;display:grid;place-items:center;font-size:28px}
.card .tit{font-weight:600;font-size:16px;line-height:1.25;margin-bottom:2px}
.card .meta{font-size:14px;color:var(--cinza)}.card .meta b{color:var(--tinta);font-weight:600}
.vazio{padding:28px 8px;text-align:center}.vazio p{font-size:17px;font-weight:600;margin-bottom:12px}
.etiqueta{background:#fff;border-radius:999px;padding:4px 9px;font:600 12px/1 'Public Sans',sans-serif;color:var(--tinta);box-shadow:0 1px 5px rgba(23,23,26,.3);white-space:nowrap;display:inline-block;transform:translate(-50%,-50%)}
.etiqueta.foco{background:var(--vinho);color:#fff}
.etiqueta.sel{background:var(--vermelho);color:#fff;font-size:13px;padding:6px 11px;box-shadow:0 3px 12px rgba(214,35,46,.5);outline:2px solid #fff}
.t-ato{background:#ffe4d6}.t-caminhada{background:#e0f5f3}.t-cultural{background:#fbe3f4}
.t-panfletagem{background:#fde7e9}.t-adesivaco{background:#fff1d6}.t-encontro{background:#e6f0ff}.t-ligatona{background:#e8f4ec}.t-porta{background:#f1e8ff}.t-bandeiraco{background:#fde7e9}.t-outro{background:var(--nevoa)}
.leaflet-container{font-family:inherit}#tela-mapa .leaflet-top,#tela-mapa .leaflet-bottom{z-index:650}.leaflet-bottom.leaflet-right{margin-bottom:126px}
.leaflet-control-attribution{font-size:10px}

  #topo{left:16px;right:auto;width:440px}

  nav .marca{display:inline-flex;margin-right:auto;font-size:19px;font-weight:800;letter-spacing:-.02em;color:var(--tinta);padding:0}
  nav .marca em{font-style:normal;color:var(--vermelho)}
  nav a{flex:0 0 auto;flex-direction:row;gap:7px;font-size:14px;padding:0 14px;height:40px;border-radius:10px}
  nav a>span:first-child svg{width:19px;height:19px}nav a:hover{background:var(--nevoa)}nav a.ativo{color:var(--tinta);background:var(--nevoa)}
  nav a.cta{flex:0 0 auto;padding:0 20px;margin-left:10px;font-size:15px}nav a.cta:hover,nav a.cta.ativo{background:var(--vinho)}
  /* páginas internas mais largas e com respiro */
  .pagina{max-width:760px;padding:32px 24px 56px}.pagina.estreita{max-width:620px}
  h1{font-size:34px}
  /* página da ação em duas colunas: conteúdo à esquerda, turnos fixos à direita */
  .acao{display:grid;grid-template-columns:minmax(0,1fr) 340px;column-gap:40px;align-items:start}
  .acao-lado{grid-column:2;grid-row:1/span 2;position:sticky;top:calc(var(--cab) + 24px);border:1.5px solid var(--nevoa);border-radius:18px;padding:6px 20px 16px;box-shadow:0 8px 28px rgba(23,23,26,.08)}
  .acao-lado h2{margin-top:14px}.acao-corpo,.acao-resto{grid-column:1}
  /* inicial: filtros em uma linha, cards em grade com hover */
  .inicio-pg{padding:36px 24px 56px}.hero{margin-bottom:28px}
  .hero h1{font-size:44px}.hero p{font-size:18px}
  .filtros{flex-direction:row;flex-wrap:wrap;gap:8px 28px;align-items:center}.datas{margin-left:0}
  .trilho{grid-auto-flow:row;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px 22px;overflow:visible}
  /* desktop: uma linha de cards por bloco; o resto abre no "Ver todas as ações" */
  .trilho:not(.aberto) .evento:nth-child(n+5){display:none}
  .ver-todas{display:block;margin:2px auto 0;background:#fff;border:1.5px solid var(--tinta);border-radius:999px;padding:9px 20px;font-weight:600;font-size:14px;cursor:pointer;color:var(--tinta)}
  .ver-todas:hover{background:var(--nevoa)}
  .foto{transition:transform .2s ease,box-shadow .2s ease}.evento:hover .foto{transform:translateY(-2px);box-shadow:0 10px 24px rgba(23,23,26,.14)}
  .evento:hover .tit{text-decoration:underline}
  /* mapa: ocupa a área abaixo do cabeçalho */
  #tela-mapa{inset:var(--cab) 0 0 0}
  #topo{top:16px}
  .cabeca .filtro{flex-wrap:wrap}
}
@media (max-width:899px){nav .marca{display:none}.so-desk{display:none}}@media (min-width:900px){.so-cel{display:none}}

<!-- contagem de visitas sem cookie (GoatCounter, painel em acoes-segundo-turno.goatcounter.com): a tela vem do hash,
     sem a query (onde passa o code do login); não conta em localhost. Versão fixa (count.v5.js) com o hash publicado
     em https://www.goatcounter.com/help/countjs-versions, para o navegador recusar o script se ele mudar -->

<script data-goatcounter="https://acoes-segundo-turno.goatcounter.com/count" async src="https://gc.zgo.at/count.v5.js" integrity="sha384-atnOLvQb9t+jTSipvd75X2yginT4PjVbqDdlJAmxMm+wYElFmeR6EmLP5bYeoRVQ" crossorigin="anonymous"></script>
<script>
// ---------- dados e helpers ----------
// contagem: a tela a cada troca de hash e cliques como eventos; o evento leva só o nome, nada de quem clicou.
// No modo exemplo os eventos não contam; sem o script (bloqueador, localhost) não faz nada
function contar(evento){try{if(window.API&&API.modo==='exemplo')return;if(window.goatcounter&&goatcounter.count)goatcounter.count({path:evento,title:evento,event:true})}catch(e){}}
function contarTela(){try{if(window.goatcounter&&goatcounter.count)goatcounter.count()}catch(e){}}
// tipos de ação, na ordem dos chips; revistos em 2026-10-09 a partir das ações reais da agenda Bora Lula
// (encontro e plenária, ato e caminhada dominam; ligatona e porta a porta ficam para quem cria ação)
const ICONES={'panfletagem':'📄','encontro':'🗣️','ato':'📣','caminhada':'🚶','cultural':'🎶','bandeiraço':'🚩','adesivaço':'🏷️','porta a porta':'🚪','ligatona':'📞','outro':'✨'};
const CLASSE={'panfletagem':'t-panfletagem','encontro':'t-encontro','ato':'t-ato','caminhada':'t-caminhada','cultural':'t-cultural','bandeiraço':'t-bandeiraco','adesivaço':'t-adesivaco','porta a porta':'t-porta','ligatona':'t-ligatona','outro':'t-outro'};
const TIPOS=Object.keys(ICONES);
// nomes antigos que ainda podem vir do banco antes da migração dos tipos
const TIPO_ANTIGO={'roda de conversa':'encontro'};
const tipoAtual=t=>TIPO_ANTIGO[t]||(ICONES[t]?t:'outro');
function normalizarTipos(acoes){(acoes||[]).forEach(a=>{if(a)a.tipo=tipoAtual(a.tipo)});return acoes}
// filtros da inicial e do mapa são separados: cada tela tem o seu e ele não vaza para a outra
const filtroNovo=()=>({quando:'breve',de:'',ate:'',formato:'qualquer',tipo:null});
const estado={onde:null,filtros:{inicio:filtroNovo(),mapa:filtroNovo()},perto:null,geoTentada:false,gaveta:'baixa',vista:{lat:-23.62,lon:-46.62,zoom:10},foco:null,sel:null,filaAba:'analise',inscrevendo:null,minhasAberta:null,recusando:null,erroRecusa:null,bloqueando:null,erroBloqueio:null,aviso:null,sessao:null,acaoAberta:null,vitrineAberta:{}};
let telaAtual='inicio',rotaAnterior=null,ultimaLista=null;
const F=()=>estado.filtros[telaAtual==='mapa'?'mapa':'inicio'];
let PUB={config:{hoje:'',frase:'',vaquinha:'#'},organizacoes:[],acoes:[],turnos:[]};
const org=id=>PUB.organizacoes.find(o=>o.id===id);
const pessoa=id=>DADOS.pessoas.find(p=>p.id===id); // só telas de organizador e moderador (modo exemplo)
const eu=()=>estado.sessao?estado.sessao.id:null;
const turnosDa=id=>PUB.turnos.filter(t=>t.acao===id).sort((a,b)=>a.inicio.localeCompare(b.inicio));
// hora atual em Brasília: ao vivo no site (aba aberta por horas continua certa); no exemplo, fixa em dados.config.agora
const agora=()=>API.modo==='exemplo'?(PUB.config.agora||PUB.config.hoje+'T00:00'):ApiSupabase.agoraBrasilia();
// turno que ainda vale: o exato até a hora em que termina; o aproximado (divulgação sem hora) até o fim do dia.
// O que já aconteceu sai das listas, do mapa, do "Eu vou!" e da agenda
const turnoVale=t=>t.horaAproximada?t.fim.slice(0,10)>=agora().slice(0,10):t.fim>agora();
function turnosFuturos(id){return turnosDa(id).filter(turnoVale)}
// filtro de data: lista de opções e o intervalo [de, até] (AAAA-MM-DD, inclusivo) que cada uma representa
const QUANDO=[['breve','Em breve'],['hoje','Hoje'],['amanha','Amanhã'],['semana','Esta semana'],['fds','Fim de semana'],['proxima','Próxima semana'],['datas','Escolher datas']];
function intervaloQuando(){const h=PUB.config.hoje,w=new Date(h+'T00:00').getDay(),fim='9999-12-31',f=F();
  switch(f.quando){
    case 'hoje':return[h,h];
    case 'amanha':{const a=somaDias(h,1);return[a,a]}
    case 'semana':return[h,somaDias(h,(7-w)%7)];
    case 'fds':{if(w===0)return[h,h];const sab=somaDias(h,(6-w+7)%7);return[sab,somaDias(sab,1)]}
    case 'proxima':{const seg=somaDias(h,((8-w)%7)||7);return[seg,somaDias(seg,6)]}
    case 'datas':return[f.de&&f.de>=h?f.de:h,f.ate||fim];
    default:return[h,fim]}}
function turnosNoFiltro(id){const[de,ate]=intervaloQuando();return turnosFuturos(id).filter(t=>{const d=t.inicio.slice(0,10);return d>=de&&d<=ate})}
const ehOnline=a=>!!(a.lugar&&a.lugar.online);
const temPino=a=>!ehOnline(a)&&a.lugar&&typeof a.lugar.lat==='number'&&typeof a.lugar.lon==='number';
const vaoNo=t=>t.vao||0;
const estouInscrito=tid=>!!(estado.acaoAberta&&estado.acaoAberta.inscrita.includes(tid));
// helpers só do modo exemplo, para Criar, Minhas e Fila (que ainda leem DADOS até o próximo plano)
const acaoExemplo=id=>DADOS.acoes.find(a=>a.id===id);
const turnosDaExemplo=id=>DADOS.turnos.filter(t=>t.acao===id).sort((a,b)=>a.inicio.localeCompare(b.inicio));
const inscritosNo=tid=>DADOS.inscricoes.filter(i=>i.turno===tid&&!i.canceladaEm);
const vaoNaExemplo=id=>turnosDaExemplo(id).reduce((n,t)=>n+inscritosNo(t.id).length,0);
function vaoNa(id){const ts=turnosDa(id);return ts.length?ts.reduce((n,t)=>n+vaoNo(t),0):(API.modo==='exemplo'?vaoNaExemplo(id):0)}
const DIAS=['dom','seg','ter','qua','qui','sex','sáb'];
function hora(d){return d.getHours()+'h'+(d.getMinutes()?String(d.getMinutes()).padStart(2,'0'):'')}
function fmtDia(d){return `${DIAS[d.getDay()]} ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`}
function fmtData(iso){const d=new Date(iso);return `${fmtDia(d)}, ${hora(d)}`}
function fmtCurta(iso){const d=new Date(iso);return `${DIAS[d.getDay()]} ${hora(d)}`}
// horário aproximado (a divulgação só disse "à noite"): mostra o período em vez da hora
function periodo(t){const h=new Date(t.inicio).getHours(),f=new Date(t.fim).getHours();if(h<12&&f>=18)return 'horário a confirmar';return h<12?'de manhã':h<18?'à tarde':'à noite'}
function quandoTurno(t){if(!t.horaAproximada)return fmtData(t.inicio);return `${fmtDia(new Date(t.inicio))}, ${periodo(t)}`}
function quandoCurto(t){if(!t.horaAproximada)return fmtCurta(t.inicio);return `${DIAS[new Date(t.inicio).getDay()]} ${periodo(t)}`}
function distanciaKm(a,b){const r=6371,x=(b.lat-a.lat)*Math.PI/180,y=(b.lon-a.lon)*Math.PI/180;const s=Math.sin(x/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(y/2)**2;return 2*r*Math.asin(Math.sqrt(s))}
function quantosInscritos(n){return n===1?'1 inscrito':n+' inscritos'}
function quantosVao(n){return n===1?'1 vai':n+' vão'}
// quantos vão só aparece quando alguém já disse "Eu vou!" ("0 vão" desanima)
function linhaVao(a){const n=vaoNa(a.id);return n?`<div class="meta vao">🙋 ${quantosVao(n)}</div>`:''}
function lugarCurto(l){if(l.online)return 'Online';return !l.bairro||l.bairro===l.cidade?l.cidade:`${l.bairro}, ${l.cidade}`}

const FUNDO_ARQ={};let fundoDisponivel=null;
async function fundoBase(mapa){
  const tiles=()=>L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(mapa);
  if(!window.FUNDO||typeof protomapsL==='undefined'||typeof pmtiles==='undefined')return tiles();
  if(fundoDisponivel===null){try{fundoDisponivel=(await fetch('/_blob/'+FUNDO.baixo.ids[0],{method:'HEAD'})).ok}catch(e){fundoDisponivel=false}}
  if(!fundoDisponivel)return tiles();
  const abrir=nome=>FUNDO_ARQ[nome]||(FUNDO_ARQ[nome]=Promise.all(FUNDO[nome].ids.map(id=>fetch('/_blob/'+id).then(r=>r.text()))).then(partes=>{
    const s=atob(partes.join('')),bin=new Uint8Array(s.length);for(let i=0;i<s.length;i++)bin[i]=s.charCodeAt(i);
    setTimeout(()=>{if(camada._map)camada.redraw()},0);
    return new pmtiles.PMTiles({getKey:()=>nome,getBytes:async(o,n)=>({data:bin.buffer.slice(o,o+n)})})}));
  const roteador={async getZxy(z,x,y){
    let nomes=z<=12?['baixo']:z===13?['z13']:null;
    if(!nomes){const lon=(x+.5)/(1<<z)*360-180;nomes=lon<-46.6?['oeste','leste']:['leste','oeste'];if(Math.abs(lon+46.6)>.25)nomes=nomes.slice(0,1)}
    for(const n of nomes){let r;try{r=await(await abrir(n)).getZxy(z,x,y)}catch(e){delete FUNDO_ARQ[n]}if(r)return r}
    return undefined}};
  const camada=protomapsL.leafletLayer({url:roteador,flavor:'light',lang:'pt',maxDataZoom:14,attribution:'© OpenStreetMap, Protomaps'});
  camada._clampZoom=z=>L.GridLayer.prototype._clampZoom.call(camada,Math.round(z));
  camada.addTo(mapa);return camada}

  <div id="topo"><div class="busca"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg></span><input id="busca-lugar" placeholder="Cidade ou bairro" autocomplete="off" value="${esc(estado.onde?estado.onde.rotulo:'')}" oninput="sugerir(this.value)" onkeydown="teclaBusca(event)" onfocus="sugerir(this.value)">
    <button class="ico" title="Usar minha localização" onclick="usarLocalizacao()">📍</button></div><div id="sugestoes"></div>
   ${tiposHtml()}</div>
  <div id="gaveta" class="${estado.gaveta==='meio'?'meio':estado.gaveta==='cheia'?'cheia':''}"><div class="puxa" ontouchstart="arrastar(event)">
   <button class="alca" onclick="alternarGaveta()" aria-label="Abrir ou fechar a lista"><span></span></button>
   <div class="cabeca"><div class="topo-gaveta"><strong id="contagem" onclick="alternarGaveta()"></strong></div>${filtrosHtml()}</div></div>
   <div id="lista" onscroll="maisCards()"></div></div></div>`}
function montarMapa(){
  const el=document.getElementById('mapa');if(!el)return;
  mapa=L.map(el,{zoomControl:false}).setView([estado.vista.lat,estado.vista.lon],estado.vista.zoom);
  L.control.zoom({position:'bottomright'}).addTo(mapa);
  fundoBase(mapa);
  const este=mapa;mapa.on('moveend',()=>{if(mapa!==este)return;const c=mapa.getCenter();estado.vista={lat:c.lat,lon:c.lng,zoom:mapa.getZoom()};atualizarLista()});
  desenharPinos();atualizarLista();
}
function etiquetaPino(x){return L.divIcon({html:`<span class="etiqueta ${estado.foco===x.a.id?'foco':''} ${estado.sel===x.a.id?'sel':''}">${ICONES[x.a.tipo]} ${quandoCurto(x.t)}</span>`,className:'',iconSize:[0,0]})}
// prévia da ação sobre o mapa, como no Airbnb: foto, título, quando, onde e link para a página
function previaHtml(x){const a=x.a;return `<a class="corpo" href="#/acao/${a.id}">${fotoEvento(x)}<div class="txt">
  <div class="tit">${esc(a.titulo)}</div><div class="meta"><b>${quandoTurno(x.t)}</b></div>
  <div class="meta">${esc(lugarCurto(a.lugar))}${x.km!=null?`, a ${fmtKm(x.km)} km`:''}</div>
  <div class="meta">${quemDivulga(a)}</div><span class="ver">Ver ação →</span></div></a>`}
let popupPrevia=null,rolarAteSel=false;
const ehDesktop=()=>window.matchMedia('(min-width:900px)').matches;
// selecionar (clique no pino) é diferente de focar (passar o mouse): fica marcado até fechar a prévia
function selecionar(x,pos){estado.sel=x.a.id;marcarSelecao();
  const pad=ehDesktop()?{autoPanPaddingTopLeft:[480,80],autoPanPaddingBottomRight:[40,40]}:{autoPanPaddingTopLeft:[16,150],autoPanPaddingBottomRight:[16,150]};
  if(popupPrevia)popupPrevia.off('remove');
  popupPrevia=L.popup(Object.assign({className:'previa',maxWidth:260,minWidth:260,offset:[0,-10]},pad)).setLatLng(pos).setContent(previaHtml(x)).openOn(mapa);
  popupPrevia.on('remove',()=>{popupPrevia=null;if(estado.sel===x.a.id){estado.sel=null;marcarSelecao()}});
  if(ehDesktop()){rolarAteSel=true;rolarParaSel();setTimeout(()=>{rolarAteSel=false},800)}}
function marcarSelecao(){document.querySelectorAll('.card').forEach(c=>c.classList.toggle('sel',c.id==='card-'+estado.sel));
  marcadores.forEach(m=>{const s=m._acao===estado.sel;m.setZIndexOffset(s?1000:0);const el=m.getElement();const e=el&&el.querySelector('.etiqueta');if(e)e.classList.toggle('sel',s)})}
function rolarParaSel(){const i=listaAqui.findIndex(x=>x.a.id===estado.sel);if(i>=listaFeita)maisCards(i+1);const c=document.getElementById('card-'+estado.sel);if(c)c.scrollIntoView({block:'center',behavior:'smooth'})}
function abrirGaveta(nivel){estado.gaveta=nivel;const g=document.getElementById('gaveta');if(g)g.className=nivel==='baixa'?'':nivel}
// os pinos só dependem dos filtros, que remontam o mapa: desenhados uma vez, não a cada movimento (recriar centenas pesava no fim do arrasto)
function desenharPinos(){
  marcadores.forEach(m=>m.remove());marcadores=[];
  const todas=acoesVisiveis().filter(x=>temPino(x.a)),pos=espalhar(todas);
  todas.forEach((x,i)=>{const m=L.marker(pos[i],{icon:etiquetaPino(x),riseOnHover:true,zIndexOffset:estado.sel===x.a.id?1000:0});m._acao=x.a.id;m.addTo(mapa);
    // a distância vale para o lugar buscado agora: a busca move o mapa sem redesenhar os pinos
    m.on('click',()=>{x.km=estado.onde?distanciaKm(estado.onde,x.a.lugar):null;selecionar(x,pos[i])});marcadores.push(m)});
}
// a cada movimento do mapa só a contagem e a lista mudam. Com zoom afastado são centenas de cards: a lista sai em
// lotes (os seguintes entram ao rolar) e nem é refeita se as ações na tela não mudaram; refazer tudo travava o fim do arrasto e do zoom
const LOTE_CARDS=30;let listaAqui=[],listaFeita=0,listaChave=null;
function atualizarLista(){
  if(!mapa)return;
  const vistas=acoesVisiveis(),aqui=acoesNaArea(vistas),online=acoesOnline(vistas),el=document.getElementById('lista');
  document.getElementById('contagem').textContent=aqui.length?`${aqui.length===1?'1 ação':aqui.length+' ações'} nesta área`:'Nenhuma ação nesta área';
  const chave=(estado.onde?estado.onde.lat+','+estado.onde.lon:'')+'|'+aqui.map(x=>x.a.id).join(',');
  if(chave!==listaChave||!el.childElementCount){listaChave=chave;listaAqui=aqui;listaFeita=0;const topo=el.scrollTop;
    el.innerHTML=(aqui.length?'<div id="cards-aqui"></div>':
      `<div class="vazio"><p>Ainda não tem ação por aqui.</p><p class="sec" style="font-weight:400">Afaste o mapa para ver outras, ou crie a primeira ação do seu bairro.</p><a class="btn" href="#/criar" onclick="novaCriacao()">Cadastrar ação</a></div>`)
      +(online.length?`<h2 style="margin-top:18px">Online, de qualquer lugar</h2>${online.map(cardAcao).join('')}`:'');
    // repõe a rolagem que a pessoa tinha: lotes até cobrir a posição, depois os de folga
    maisCards(LOTE_CARDS);const box=document.getElementById('cards-aqui');
    while(box&&listaFeita<listaAqui.length&&box.offsetHeight<topo+el.clientHeight)maisCards(listaFeita+LOTE_CARDS);
    el.scrollTop=topo;maisCards()}
  if(rolarAteSel)rolarParaSel();
}
// sem `ate`: põe lotes enquanto o fim dos cards da área (não o da lista, que segue com o bloco Online) estiver perto da
// parte visível; com `ate`: até o card pedido, ao selecionar um pino. A lista não tem âncora de rolagem (overflow-anchor):
// com ela, o Chrome empurrava a rolagem a cada lote posto acima do bloco Online e o laço carregava tudo
function maisCards(ate){const el=document.getElementById('lista'),box=document.getElementById('cards-aqui');if(!el||!box)return;
  const por=n=>{box.insertAdjacentHTML('beforeend',listaAqui.slice(listaFeita,n).map(cardAcao).join(''));listaFeita=Math.min(n,listaAqui.length)};
  if(ate){if(ate>listaFeita)por(ate);return}
  while(listaFeita<listaAqui.length&&box.getBoundingClientRect().bottom-el.getBoundingClientRect().bottom<600)por(listaFeita+LOTE_CARDS)}
function focar(id){estado.foco=id;document.querySelectorAll('.card').forEach(c=>c.classList.toggle('foco',c.id==='card-'+id));
  marcadores.forEach(m=>{const el=m.getElement();const e=el&&el.querySelector('.etiqueta');if(e)e.classList.toggle('foco',m._acao===id)})}
function alternarGaveta(){abrirGaveta(estado.gaveta==='baixa'?'meio':estado.gaveta==='meio'?'cheia':'baixa')}
// a gaveta acompanha o dedo em qualquer ponto do topo dela (alça, contagem, filtros); arrasto de lado é dos filtros
let arrastando=false;
function arrastar(ev){const g=document.getElementById('gaveta');if(!g||ehDesktop()||arrastando||ev.touches.length>1)return;arrastando=true;
  const x0=ev.touches[0].clientX,y0=ev.touches[0].clientY,ty0=new DOMMatrix(getComputedStyle(g).transform).m42;let eixo=null,dy=0;
  const mover=e=>{const dx=e.touches[0].clientX-x0;dy=e.touches[0].clientY-y0;
    if(!eixo){if(Math.abs(dx)<8&&Math.abs(dy)<8)return;eixo=Math.abs(dy)>Math.abs(dx)?'y':'x'}
    if(eixo==='y'){g.style.transition='none';g.style.transform=`translateY(${Math.max(0,Math.min(g.offsetHeight-132,ty0+dy))}px)`}};
  const fim=()=>{arrastando=false;document.removeEventListener('touchmove',mover);document.removeEventListener('touchend',fim);document.removeEventListener('touchcancel',fim);
    g.style.transition='';g.style.transform='';if(eixo!=='y'||Math.abs(dy)<30)return;
    const ordem=['baixa','meio','cheia'];let i=ordem.indexOf(estado.gaveta)+(dy<0?1:-1);if(Math.abs(dy)>window.innerHeight*.45)i+=dy<0?1:-1;
    abrirGaveta(ordem[Math.max(0,Math.min(2,i))])};
  document.addEventListener('touchmove',mover,{passive:true});document.addEventListener('touchend',fim);document.addEventListener('touchcancel',fim)}
// duas caixas usam as mesmas sugestões: a busca principal (leva ao mapa) e a troca de cidade da inicial
const SUG={busca:{box:'sugestoes',ao:l=>{document.getElementById('busca-lugar').value=nomeLugar(l);irParaLugar(l)}},
  cidade:{box:'sug-cidade',ao:l=>escolherCidade(l)}};
let sugFoco=-1,sugAtual=[],sugAlvo='busca';
function sugerir(q,alvo='busca'){sugAlvo=alvo;const box=document.getElementById(SUG[alvo].box);if(!box)return;sugAtual=buscarLugares(q);sugFoco=-1;
  box.innerHTML=sugAtual.map((l,i)=>`<div onclick="escolherSugestao(${i})">${rotuloLugar(l)}</div>`).join('');box.style.display=sugAtual.length?'block':'none'}
function teclaBusca(e){if(e.key==='Escape'){if(sugAlvo==='cidade')fecharCidade();else document.getElementById('sugestoes').style.display='none';return}
  if(!sugAtual.length)return;if(e.key==='ArrowDown'){sugFoco=Math.min(sugAtual.length-1,sugFoco+1)}else if(e.key==='ArrowUp'){sugFoco=Math.max(0,sugFoco-1)}else if(e.key==='Enter'){escolherSugestao(sugFoco<0?0:sugFoco);return}else return;
  document.querySelectorAll('#'+SUG[sugAlvo].box+' div').forEach((d,i)=>d.classList.toggle('foco',i===sugFoco))}
const nomeLugar=l=>l[4]==='d'?`${l[0]}, São Paulo`:`${l[0]}, ${l[1]}`;
function escolherSugestao(i){const l=sugAtual[i];if(!l)return;const s=SUG[sugAlvo];const box=document.getElementById(s.box);if(box)box.style.display='none';s.ao(l)}
function irParaLugar(l){estado.onde={rotulo:nomeLugar(l),lat:l[2],lon:l[3]};const zoom=l[4]==='d'?13:l[4]==='c'?11:12;
  if(mapa)mapa.setView([l[2],l[3]],zoom);else{estado.vista={lat:l[2],lon:l[3],zoom};location.hash='#/mapa'}
  if(estado.gaveta==='baixa')abrirGaveta('meio')}
function usarLocalizacao(){if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>{irParaLugar(['Minha localização','',p.coords.latitude,p.coords.longitude,'g'])},()=>{})}

async function entrar(){contar('entrar');await API.entrar();await sincronizar()}
async function sair(){await API.sair();localStorage.removeItem('vouPendente');estado.inscrevendo=null;await sincronizar()}
// logado, o botão da conta leva ao Perfil (onde fica o Sair); deslogado, entra com o Google
function contaClique(){if(estado.sessao)return true;entrar().catch(e=>console.error(e));return false}
// a doação é uma só, geral, e aponta para a arrecadação oficial (configuracao.vaquinha)
const linkDoar=()=>`<a class="btn sec" href="${esc(PUB.config.vaquinha||'#')}" target="_blank" rel="noopener">Doe para a campanha do Lula ↗</a>`;
// menu "⋯": ações que não podem ser fáceis demais de tocar (desistir, encerrar) só aparecem depois de abrir
const menuMais=itens=>`<details class="mais"><summary aria-label="Mais opções" title="Mais opções">⋯</summary><div class="opcoes">${itens}</div></details>`;
const botaoEntrar=()=>`<button class="btn google" onclick="entrar()"><span class="g" aria-hidden="true">G</span> Entrar com Google</button>`;
// minhas inscrições: uma ação por linha; desistir fica no menu ⋯
const inscProxima=m=>!m.desistiu&&m.acao.status==='publicada'&&m.turno.inicio.slice(0,10)>=PUB.config.hoje;
// por que a inscrição saiu da lista de próximas: nada some, fica no histórico com o motivo
const SITUACAO_INSC={rascunho:'ação fora do ar','excluída':'ação excluída',recusada:'ação recusada','em análise':'ação em análise'};
const situacaoInsc=m=>m.desistiu?'você desistiu':m.acao.status==='publicada'?'já aconteceu':m.acao.status==='encerrada'?ENCERRADA[encerramento(m.acao)].insc:SITUACAO_INSC[m.acao.status]||'ação encerrada';
function linhaInscricao(m){const prox=inscProxima(m);
  return `<div class="insc"><a class="insc-link" href="#/acao/${m.acao.id}">${cuboAcao(m.acao,'width:56px;height:56px;font-size:24px;border-radius:12px')}
    <div style="min-width:0"><div class="tit">${esc(m.acao.titulo)}</div><div class="meta"><b>${fmtData(m.turno.inicio)}</b> · ${esc(lugarCurto(m.acao.lugar))}</div></div></a>
    <div class="insc-acoes">${prox?`${botaoAgenda(m.acao,m.turno)}${menuMais(`<button class="perigo" onclick="desistir(${m.turno.id})">Desistir de ir</button>`)}`:`<span class="sec">${situacaoInsc(m)}</span>`}</div></div>`}
function secaoInscricoes(){const lista=estado.minhasInscricoes||[],prox=lista.filter(inscProxima),pass=lista.filter(m=>!inscProxima(m));
  return `<section id="inscricoes"><h2>Onde eu vou</h2>${prox.length?`<div class="lista-insc">${prox.map(linhaInscricao).join('')}</div>`:
    '<p class="sec" style="font-size:15px">Você ainda não disse "Eu vou!" em nenhuma ação. <a href="#/inicio" style="color:var(--vinho);font-weight:600">Ver ações</a></p>'}
   ${pass.length?`<details class="passadas"><summary>Passadas, canceladas ou desistências (${pass.length})</summary><div class="lista-insc">${pass.map(linhaInscricao).join('')}</div></details>`:''}</section>`}
async function desistir(tid){await API.desistir(tid);await sincronizar()}
// onde: 'topo' (botão logo abaixo do título, no celular) ou 'lado' (coluna "Quando"); o formulário abre ali
async function iniciarVou(tid,onde){contar('eu-vou-clique');estado.vouOnde=onde||null;
  if(!estado.sessao){localStorage.setItem('vouPendente',String(tid));await API.entrar();await continuarVouPendente();return}
  await abrirVou(tid)}
async function continuarVouPendente(){const tid=Number(localStorage.getItem('vouPendente'));if(!tid)return;
  estado.sessao=await API.sessao();if(!estado.sessao)return;localStorage.removeItem('vouPendente');await abrirVou(tid)}
// "Eu vou!": em ação de divulgação marca presença na hora (sem telefone); nas outras abre a confirmação do WhatsApp
async function abrirVou(tid){const [,rota,arg]=(location.hash||'').split('/');
  if(rota==='acao'&&(!estado.acaoAberta||estado.acaoAberta.acao.id!==Number(arg))){estado.acaoAberta=await API.acao(Number(arg));if(estado.acaoAberta)normalizarTipos([estado.acaoAberta.acao])}
  const ab=estado.acaoAberta;
  if(ab&&semInscricao(ab.acao)){
    try{await API.inscrever(tid)}catch(e){estado.inscrevendo={turno:tid,semFormulario:true,erro:MENSAGEM[e.codigo]||'Não deu. Tente de novo.'};await render();return}
    contar('eu-vou-confirmado');estado.inscrevendo=null;await recarregar();await render();estado.vouOk=tid;await render();return}
  estado.inscrevendo={turno:tid,telefone:estado.sessao.telefone||'',erro:null};await render()}
const MENSAGEM={sem_texto:'Escreva a mensagem.',muitas_mensagens:'Muitas mensagens em pouco tempo. Tente de novo mais tarde.',precisa_entrar:'Entre para se inscrever.',sem_inscricao:'Esta ação não tem inscrição: siga a divulgação original.',sem_telefone:'Informe seu WhatsApp.',telefone_invalido:'Telefone no formato (11) 9xxxx-xxxx.',bloqueada:'Sua conta está bloqueada.',lotado:'Esse horário lotou.',turno_passado:'Esse horário já passou.',nao_publicada:'Esta ação não está aberta a inscrições.',

async function confirmarVou(tid){const ins=estado.inscrevendo;const tel=(document.getElementById('vtel')||{}).value||'';
  try{if(tel!==(estado.sessao.telefone||''))estado.sessao=await API.salvarTelefone(tel);await API.inscrever(tid)}
  catch(e){ins.erro=MENSAGEM[e.codigo]||'Não deu. Tente de novo.';ins.telefone=tel;render();return}
  contar('eu-vou-confirmado');estado.inscrevendo=null;await recarregar();await render();estado.vouOk=tid;await render()}
async function inscrever(tid){return confirmarVou(tid)}
// ---------- adicionar à agenda (Google Agenda por link, Apple e Outlook por arquivo .ics) ----------
// os horários são de Brasília (sem horário de verão desde 2019): convertemos para UTC somando 3 horas
const fmtUtc=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
const deBrasilia=iso=>new Date(iso.slice(0,16)+':00-03:00');
const utcAgenda=iso=>fmtUtc(deBrasilia(iso));
const fimAgenda=t=>t.fim?utcAgenda(t.fim):fmtUtc(new Date(deBrasilia(t.inicio).getTime()+2*3600e3)); // sem fim: 2 horas
const linkAcao=a=>location.origin+location.pathname+'#/acao/'+a.id;
const ondeAgenda=a=>ehOnline(a)?'Online':[a.lugar.nome,lugarCurto(a.lugar)].filter(Boolean).join(', ');
const textoAgenda=a=>`${(a.descricao||'').slice(0,600)}\n\nMais informações: ${linkAcao(a)}`;
function linkGoogleAgenda(a,t){const fim=fimAgenda(t);
  const q=new URLSearchParams({action:'TEMPLATE',text:a.titulo,dates:`${utcAgenda(t.inicio)}/${fim}`,details:textoAgenda(a),location:ondeAgenda(a)});
  return 'https://calendar.google.com/calendar/render?'+q.toString()}
function icsTexto(a,t){const e=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
  const dobra=l=>{const out=[];while(l.length>74){out.push(l.slice(0,74));l=' '+l.slice(74)}out.push(l);return out.join('\r\n')};
  const fim=fimAgenda(t);
  const agora=fmtUtc(new Date());
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//acoes-segundo-turno//pt-BR','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT',
    `UID:turno-${t.id}@acoes-segundo-turno`,`DTSTAMP:${agora}`,`DTSTART:${utcAgenda(t.inicio)}`,`DTEND:${fim}`,
    `SUMMARY:${e(a.titulo)}`,`LOCATION:${e(ondeAgenda(a))}`,`DESCRIPTION:${e(textoAgenda(a))}`,`URL:${linkAcao(a)}`,
    'BEGIN:VALARM','TRIGGER:-PT2H','ACTION:DISPLAY',`DESCRIPTION:${e(a.titulo)}`,'END:VALARM','END:VEVENT','END:VCALENDAR'].map(dobra).join('\r\n')+'\r\n'}
const agendaCache={};
function baixarIcs(chave){const x=agendaCache[chave];if(!x)return;contar('agenda-ics');const blob=new Blob([icsTexto(x.a,x.t)],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob),l=document.createElement('a');l.href=url;l.download=`acao-${x.a.id}.ics`;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function botaoAgenda(a,t){if(!turnoVale(t))return '';const k=a.id+'-'+t.id;agendaCache[k]={a,t};
  return `<details class="agenda"><summary>📅 Adicionar à agenda</summary><div class="opcoes">
   <a href="${esc(linkGoogleAgenda(a,t))}" target="_blank" rel="noopener" onclick="contar('agenda-google')">Google Agenda</a>
   <button onclick="baixarIcs('${k}')">Apple ou Outlook (arquivo .ics)</button></div></details>`}

// lado maior até 1600 px, JPEG 85%: sobe rápido no 4G e cabe no limite do bucket
function reduzirImagem(arq,lado=1600){return new Promise((ok,falha)=>{const url=URL.createObjectURL(arq),img=new Image();
  img.onload=()=>{const k=Math.min(1,lado/Math.max(img.naturalWidth,img.naturalHeight)),cv=document.createElement('canvas');cv.width=Math.round(img.naturalWidth*k);cv.height=Math.round(img.naturalHeight*k);
    const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);
    cv.toBlob(b=>b?ok(b):falha(Object.assign(new Error('imagem'),{codigo:'imagem_invalida'})),'image/jpeg',.85)};
  img.onerror=()=>{URL.revokeObjectURL(url);falha(Object.assign(new Error('imagem'),{codigo:'imagem_invalida'}))};img.src=url})}

async function recarregar(){PUB=await API.publico();normalizarTipos(PUB.acoes);estado.sessao=await API.sessao()}
let renderN=0,manterRolagem=false,hashAnterior='';
// rerender: a mesma tela se redesenha no lugar (filtro, caixa marcada) e a rolagem fica onde estava
function rerender(){manterRolagem=true;return render()}
async function render(){
  const n=++renderN,manter=manterRolagem,y=window.scrollY;manterRolagem=false;
  const h=location.hash||'#/inicio';const [,rota,arg]=h.split('/');

    if(rota==='acao'){const r=await API.acao(Number(arg));if(n!==renderN)return;if(r)normalizarTipos([r.acao]);estado.acaoAberta=r}

    if(rota!=='perfil')estado.orgForm=null;
    if((rota==='perfil'||rota==='minhas'||rota==='inscricoes')&&estado.sessao){const [ma,mi]=await Promise.all([API.minhasAcoes(),API.minhasInscricoes()]);if(n!==renderN)return;
      normalizarTipos(ma.map(m=>m.acao));normalizarTipos(mi.map(m=>m.acao));estado.minhasAcoes=ma;estado.minhasInscricoes=mi}
    if(rota==='fila'&&estado.sessao&&estado.sessao.papel==='moderador'){
      if(estado.filaAba==='org'){const r=await API.filaOrganizacoes();if(n!==renderN)return;estado.filaOrg=r}
      else if(estado.filaAba==='msgs'){const r=await API.feedbacks(!estado.msgsTratadas);if(n!==renderN)return;estado.feedbacks=r}
      else{const r=await API.fila({analise:'em análise',publicadas:'publicada',suspensas:'rascunho'}[estado.filaAba]);if(n!==renderN)return;normalizarTipos(r.map(m=>m.acao));estado.fila=r}}
  }catch(e){if(n!==renderN)return;console.error(e);if(mapa){mapa.remove();mapa=null;marcadores=[]}
    document.getElementById('app').innerHTML='<div class="pagina"><p class="erro">Não foi possível carregar. Tente de novo.</p></div>';return}
  if(mapa){mapa.remove();mapa=null;marcadores=[]}
  // filtro vale só na tela onde foi escolhido: ao chegar na inicial ou no mapa vindo de outra tela, começa limpo;
  // a exceção é voltar da página de uma ação para a mesma lista de onde se saiu
  const r=rota||'inicio';
  if((r==='inicio'||r==='mapa')&&rotaAnterior!==r&&!(rotaAnterior==='acao'&&ultimaLista===r))estado.filtros[r]=filtroNovo();
  if(r==='inicio'||r==='mapa')ultimaLista=r;

  const rotaNav={minhas:'perfil',inscricoes:'perfil'}[rota]||rota||'inicio';
  document.querySelectorAll('nav a[data-rota]').forEach(a=>a.classList.toggle('ativo',a.dataset.rota===rotaNav));
  document.querySelectorAll('nav a[data-so-exemplo]').forEach(a=>a.style.display=API.modo==='exemplo'?'':'none');
  document.getElementById('doar').href=PUB.config.vaquinha||'#';
  document.querySelectorAll('nav a[data-so-moderador]').forEach(a=>a.style.display=estado.sessao&&estado.sessao.papel==='moderador'?'':'none');
  document.getElementById('conta-rotulo').textContent=estado.sessao?'Perfil':'Entrar';
  document.getElementById('conta-icone').classList.toggle('logado',!!estado.sessao);

  if((rota||'inicio')==='inicio')chutarCidade();
  const ab=estado.acaoAberta;
  if(rota==='acao'&&ab&&!ehOnline(ab.acao))montarMiniMapa(ab.acao.lugar,false);
  if(rota==='criar'&&estado.criar.passo===2&&!estado.criar.online&&estado.criar.lugar.lat!=null){const r=montarMiniMapa(estado.criar.lugar,true);if(r)r.mk.on('dragend',()=>{const p=r.mk.getLatLng();estado.criar.lugar.lat=p.lat;estado.criar.lugar.lon=p.lng})}
  if(rota!=='mapa')window.scrollTo(0,manter?y:0);
  if(rota==='inscricoes'){const el=document.getElementById('inscricoes');if(el)el.scrollIntoView()}
}
async function sincronizar(){
  try{await recarregar()}catch(e){console.error(e);
    document.getElementById('app').innerHTML='<div class="pagina"><p class="erro">Não foi possível carregar. Tente de novo.</p></div>';
    document.querySelectorAll('nav a[data-so-exemplo]').forEach(a=>a.style.display=window.API&&API.modo==='exemplo'?'':'none');return}
  if(location.search.includes('code=')){history.replaceState(null,'',location.pathname+location.hash)}
  if(estado.sessao&&localStorage.getItem('vouPendente')){await continuarVouPendente();return}
  await render()}
document.addEventListener('click',e=>{if(!e.target.closest('#topo,.caixa')){const s=document.getElementById('sugestoes');if(s)s.style.display='none'}
  if(!e.target.closest('.cab-cidade'))fecharCidade();
  document.querySelectorAll('details.agenda[open],details.mais[open]').forEach(d=>{if(!d.contains(e.target))d.open=false})});
// o menu ⋯ abre para a esquerda e o da agenda para a direita; se isso cortar na borda da tela, vira para o outro lado
function ajeitarMenu(d){const o=d.querySelector('.opcoes');if(!o)return;o.classList.remove('esq','dir');
  const r=o.getBoundingClientRect();if(r.left<8)o.classList.add('esq');else if(r.right>innerWidth-8)o.classList.add('dir')}
window.matchMedia('(min-width:900px)').addEventListener('change',()=>{const ins=estado.inscrevendo;
  if(!(ins||estado.vouOk)||!(location.hash||'').startsWith('#/acao/'))return;const e=document.getElementById('vtel');if(ins&&e)ins.telefone=e.value;render()});
document.addEventListener('toggle',e=>{const d=e.target;if(d.open&&d.matches&&d.matches('details.mais,details.agenda'))ajeitarMenu(d)},true);
window.addEventListener('hashchange',render);
window.addEventListener('hashchange',contarTela);
window.addEventListener('DOMContentLoaded',sincronizar);
</script>
</body>
