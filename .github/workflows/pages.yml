name: Publicar app no GitHub Pages

# Desde 2026-10-14 a Agenda fica em boralula.org (mesmo banco, mesmos ids). Este Pages só publica redirecionar/: a
# página leva para boralula.org mantendo o #/acao/<id>, e o 404.html faz o mesmo com qualquer outro endereço.
# Sem prévia de branch e sem o publico.json de hora em hora.
on:
  push:
    branches: [master]
    paths: ["redirecionar/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp redirecionar/index.html _site/index.html && cp redirecionar/index.html _site/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
